<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>店舗詳細 | Fineme</title>
  <link rel="stylesheet" href="../assets/styles/style.css" />
  <link rel="stylesheet" href="../assets/styles/components.css" />
  <meta name="description" content="掲載店舗の詳細情報ページ" />
  <style>
    .store-header{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
    .store-cover{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--color-border)}
    .store-info p{margin:6px 0}
    .info-list{list-style:none;padding:0;margin:0}
    .info-list li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--color-border);align-items:flex-start;flex-wrap:wrap}
    .info-list strong{min-width:120px;color:#334155}
    .services-section{margin-top:32px}
    .staff-section{margin-top:32px}
    .staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--sp-5)}
    .staff-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--color-border);border-radius:var(--radius);padding:var(--sp-4);background:#fff;box-shadow:var(--shadow-sm)}
    .staff-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#f3f4f6}
    .staff-name{margin:0;font-weight:700}
    .staff-role{margin:2px 0 8px;color:var(--color-muted);font-size:14px}
    .staff-bio{margin:0}
    @media (max-width: 900px){
      .store-header{grid-template-columns:1fr}
      .info-list strong{min-width:100px}
    }
    @media (max-width: 640px){
      .info-list li{flex-direction:column;gap:4px}
      .info-list strong{min-width:0}
    }
  </style>
  </head>
<body>
  <header id="site-header"></header>
  <main class="section">
    <div class="container" style="max-width:1000px">
      <div id="store-root" class="stack"></div>
    </div>
  </main>
  <!-- 体験談セクション（store.jsのrender後に注入） -->
  <div id="stories-section" class="section" style="display:none">
    <div class="container" style="max-width:1000px">
      <h2 class="section-title" style="margin-bottom:4px">変容体験談</h2>
      <p class="muted" style="margin-bottom:16px;font-size:14px">このサービスを利用したユーザーのリアルな体験談です。</p>
      <div id="stories-list" class="stack"></div>
    </div>
  </div>
  <footer id="site-footer"></footer>
  <script src="../scripts/main.js" type="module"></script>
  <script src="../scripts/store.js" type="module"></script>
  <script>
  (async function loadStories(){
    try{
      const p = new URLSearchParams(location.search);
      const providerId = p.get('id') || p.get('storeId') || p.get('providerId') || '';
      if(!providerId) return;
      const res = await fetch(`/api/stories?providerId=${encodeURIComponent(providerId)}&status=approved`);
      const stories = await res.json();
      if(!Array.isArray(stories) || !stories.length) return;
      const section = document.getElementById('stories-section');
      const list = document.getElementById('stories-list');
      if(!section || !list) return;
      section.style.display = '';
      function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      list.innerHTML = stories.map(s => {
        const tags = Array.isArray(s.tags) ? s.tags : (s.tags||'').split(',').filter(Boolean);
        return `<div class="card" style="padding:20px">
          <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#9ca3af;margin-bottom:4px">利用前の悩み</div><div style="font-size:14px;line-height:1.7">${esc(s.concern_before)}</div></div>
          <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#9ca3af;margin-bottom:4px">どんな変化があったか</div><div style="font-size:14px;line-height:1.7">${esc(s.change_after)}</div></div>
          ${s.love_impact?`<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#9ca3af;margin-bottom:4px">恋愛・人間関係への影響</div><div style="font-size:14px;line-height:1.7">${esc(s.love_impact)}</div></div>`:''}
          ${tags.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${tags.map(t=>`<span style="padding:3px 10px;border-radius:99px;font-size:11px;background:#ede9fe;color:#5b21b6">${esc(t)}</span>`).join('')}</div>`:''}
        </div>`;
      }).join('');
    }catch(e){ console.warn('[stories]', e); }
  })();
  </script>
</body>
</html>
