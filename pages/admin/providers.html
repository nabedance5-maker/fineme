<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>掲載者管理 | Fineme 運営</title>
  <link rel="stylesheet" href="../../assets/styles/style.css" />
  <link rel="stylesheet" href="../../assets/styles/components.css" />
  <style>
    .admin-grid { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
    @media(max-width:768px){ .admin-grid { grid-template-columns: 1fr; } }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-gray { background: #f3f4f6; color: #6b7280; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .provider-row { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 10px; background: #fff; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: #fff; border-radius: 18px; padding: 28px; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media(max-width:600px){ .form-grid { grid-template-columns: 1fr; } }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field label { font-size: 12px; font-weight: 700; color: #374151; }
    .form-field input, .form-field textarea, .form-field select { padding: 8px 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
    .form-field textarea { min-height: 80px; resize: vertical; }
    .form-field-full { grid-column: 1 / -1; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; text-align: center; }
    .kpi-value { font-size: 28px; font-weight: 800; color: #111; }
    .kpi-label { font-size: 12px; color: #6b7280; margin-top: 2px; }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main class="section">
    <div class="container admin-grid">
      <aside id="admin-sidebar"></aside>
      <section class="stack">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <h1 class="section-title" style="margin:0">掲載者管理</h1>
          <button class="btn" id="btn-new" type="button">＋ 掲載者を登録</button>
        </div>
        <div class="kpi-grid">
          <div class="kpi-card"><div class="kpi-value" id="kpi-total">—</div><div class="kpi-label">登録者数</div></div>
          <div class="kpi-card"><div class="kpi-value" id="kpi-pub">—</div><div class="kpi-label">公開中</div></div>
          <div class="kpi-card"><div class="kpi-value" id="kpi-billing">—</div><div class="kpi-label">課金中</div></div>
        </div>
        <div id="list"><p class="muted">読み込み中…</p></div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="modal" style="display:none">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="margin:0;font-size:18px" id="modal-title">掲載者を登録</h2>
        <button type="button" id="modal-close" style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280">✕</button>
      </div>
      <form id="pform" class="stack">
        <div class="form-grid">
          <div class="form-field"><label>掲載名 *</label><input name="name" required placeholder="パーソナルジム TOKYO" /></div>
          <div class="form-field"><label>スラッグ * (英数字・ハイフン)</label><input name="slug" required placeholder="tokyo-gym-yamada" /></div>
          <div class="form-field"><label>メインカテゴリ *</label>
            <select name="main_category" required>
              <option value="">選択</option>
              <option value="gym">パーソナルジム</option>
              <option value="eyebrow">眉毛サロン</option>
              <option value="hair">ヘア・美容院</option>
              <option value="skin">肌・エステ</option>
              <option value="fashion">ファッション</option>
              <option value="photo">写真撮影</option>
              <option value="consulting">外見トータルサポート</option>
              <option value="makeup">メイク</option>
              <option value="nail">ネイル</option>
              <option value="hairremoval">脱毛</option>
              <option value="whitening">ホワイトニング</option>
              <option value="orthodontics">歯科矯正</option>
              <option value="marriage">結婚相談所</option>
            </select>
          </div>
          <div class="form-field"><label>エリア</label><input name="area" placeholder="東京・渋谷" /></div>
          <div class="form-field"><label>最低価格（円）</label><input name="price_from" type="number" placeholder="10000" /></div>
          <div class="form-field form-field-full"><label>メールアドレス * （ログイン・通知用）</label><input name="email" type="email" required placeholder="provider@example.com" /><small style="color:#6b7280;font-size:11px">登録すると掲載者にパスワード設定メールが自動送信されます</small></div>
          <div class="form-field"><label>LINE User ID（通知用）</label><input name="line_user_id" placeholder="Uxxxxxxxxxxxxxxxxx" /><small style="color:#6b7280;font-size:11px">掲載者のLINE User IDを入力するとLINE通知が届きます</small></div>
          <div class="form-field"><label>写真URL</label><input name="photo_url" type="url" placeholder="https://..." /></div>
          <div class="form-field"><label>プラン</label>
            <select name="plan">
              <option value="A">A（¥5,000/月）</option>
              <option value="B">B（¥7,000/月）</option>
              <option value="C">C（¥10,000/月）</option>
              <option value="free">【特例】無料プラン（課金なし）</option>
            </select>
          </div>
          <div class="form-field form-field-full"><label>キャッチコピー</label><input name="catchphrase" placeholder="初デートで堂々としていたい男性のための3ヶ月プログラム" /></div>
          <div class="form-field form-field-full"><label>サービス説明文</label><textarea name="description" placeholder="サービスの詳細・料金・メニューなど"></textarea></div>
          <div class="form-field form-field-full"><label>こんな人に向いています</label><textarea name="target_desc" placeholder="どんな悩みを持つ方に向いているか"></textarea></div>
          <div class="form-field form-field-full"><label>大切にしていること（哲学）</label><textarea name="philosophy" placeholder="サービスの考え方・スタイル・強みなど"></textarea></div>
          <div class="form-field form-field-full">
            <label>提供スタイル</label>
            <select name="provider_style">
              <option value="">未設定</option>
              <option value="explanation">納得してから動く人向け（理由を丁寧に説明）</option>
              <option value="consultation">相談しながら進めたい人向け</option>
              <option value="delegate">任せて結果を出してほしい人向け</option>
              <option value="cautious">小さく試したい人向け</option>
            </select>
          </div>
          <div class="form-field form-field-full">
            <label>得意なきっかけ（複数選択可）</label>
            <div class="checkbox-group">
              <label class="checkbox-item"><input type="checkbox" name="suitable_triggers" value="matching_app">マッチングアプリ</label>
              <label class="checkbox-item"><input type="checkbox" name="suitable_triggers" value="love">恋愛・告白前</label>
              <label class="checkbox-item"><input type="checkbox" name="suitable_triggers" value="career">就職・転職前</label>
              <label class="checkbox-item"><input type="checkbox" name="suitable_triggers" value="word">一言が刺さった</label>
              <label class="checkbox-item"><input type="checkbox" name="suitable_triggers" value="vague">ずっと気になっていた</label>
            </div>
          </div>
          <div class="form-field form-field-full">
            <label>得意な失敗パターン対応（複数選択可）</label>
            <div class="checkbox-group">
              <label class="checkbox-item"><input type="checkbox" name="handles_failure_patterns" value="lost_direction">方向を見失った</label>
              <label class="checkbox-item"><input type="checkbox" name="handles_failure_patterns" value="no_continuation">続かなかった</label>
              <label class="checkbox-item"><input type="checkbox" name="handles_failure_patterns" value="cost">コストで断念</label>
              <label class="checkbox-item"><input type="checkbox" name="handles_failure_patterns" value="awkward">関係性の問題</label>
              <label class="checkbox-item"><input type="checkbox" name="handles_failure_patterns" value="no_result">変化が見えなかった</label>
            </div>
          </div>
          <div class="form-field"><label>紹介コード</label><input name="referral_code" placeholder="空欄→スラッグで自動設定" /></div>
          <div class="form-field"><label>紹介者コード</label><input name="referred_by" placeholder="紹介者のコード" /></div>
        </div>
        <input type="hidden" name="_id" />
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
          <button type="button" class="btn btn-ghost" id="modal-cancel">キャンセル</button>
          <button type="submit" class="btn" id="modal-submit">登録する</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script src="../../scripts/main.js" type="module"></script>
  <script src="../../scripts/partials.js" type="module"></script>
  <script>
  (function(){
    let ADMIN_KEY = sessionStorage.getItem('fineme:admin:key') || '';
    if(!ADMIN_KEY){
      ADMIN_KEY = prompt('管理APIキーを入力してください：') || '';
      if(ADMIN_KEY) sessionStorage.setItem('fineme:admin:key', ADMIN_KEY);
    }
    const listEl = document.getElementById('list');
    const modal = document.getElementById('modal');
    const form = document.getElementById('pform');
    let providers = [];

    function h(){ return { 'Content-Type':'application/json', 'x-admin-key': ADMIN_KEY }; }
    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function catLabel(c){ return {gym:'ジム',eyebrow:'眉毛',hair:'ヘア',skin:'肌',fashion:'ファッション',photo:'写真',consulting:'コンサル',makeup:'メイク',nail:'ネイル',hairremoval:'脱毛',whitening:'ホワイトニング',orthodontics:'矯正',marriage:'婚活'}[c]||c; }

    async function load(){
      listEl.innerHTML = '<p class="muted">読み込み中…</p>';
      const res = await fetch('/api/admin/providers',{headers:h()});
      if(!res.ok){ listEl.innerHTML = '<p class="muted" style="color:#ef4444">取得エラー。APIキーを確認してください。</p>'; return; }
      providers = await res.json();
      document.getElementById('kpi-total').textContent = providers.length;
      document.getElementById('kpi-pub').textContent = providers.filter(p=>p.published&&!p.admin_hidden).length;
      document.getElementById('kpi-billing').textContent = providers.filter(p=>p.billing_started).length;
      if(!providers.length){ listEl.innerHTML = '<p class="muted">掲載者がいません。「掲載者を登録」から追加してください。</p>'; return; }
      listEl.innerHTML = '';
      providers.forEach(p=>{
        const row = document.createElement('div'); row.className='provider-row';
        const statusLabel = p.admin_hidden ? '強制非公開' : p.published ? '公開中' : '非公開';
        const statusClass = p.admin_hidden ? 'badge-red' : p.published ? 'badge-green' : 'badge-gray';
        row.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
            <div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <strong style="font-size:15px">${esc(p.name)}</strong>
                <span class="badge ${statusClass}">${statusLabel}</span>
                <span class="badge badge-gray">${catLabel(p.main_category)}</span>
                ${p.billing_started?'<span class="badge badge-green">課金中</span>':''}
                ${p.plan?`<span class="badge badge-gray">プラン${p.plan}</span>`:''}
              </div>
              <div style="font-size:12px;color:#6b7280;margin-top:4px">
                ${p.area?`📍 ${esc(p.area)} `:''}${p.price_from?`¥${Number(p.price_from).toLocaleString()}〜 `:''}
                <a href="/provider/${esc(p.slug)}" target="_blank" style="color:#6366f1">/provider/${esc(p.slug)}</a>
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn btn-ghost" style="font-size:12px;padding:5px 10px" data-edit="${p.id}">編集</button>
              <button class="btn btn-ghost" style="font-size:12px;padding:5px 10px" data-toggle="${p.id}" data-pub="${p.published}" data-hidden="${p.admin_hidden}">
                ${p.admin_hidden?'強制非公開解除':p.published?'非公開にする':'公開する'}
              </button>
              ${!p.admin_hidden?`<button class="btn btn-ghost" style="font-size:12px;padding:5px 10px;color:#ef4444" data-force-hide="${p.id}">強制非公開</button>`:''}
              <button class="btn btn-ghost" style="font-size:12px;padding:5px 10px;color:#ef4444" data-delete="${p.id}" data-name="${esc(p.name)}">削除</button>
            </div>
          </div>
        `;
        listEl.appendChild(row);
      });
      listEl.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>{ const p=providers.find(x=>x.id===btn.dataset.edit); if(p) openModal(p); }));
      listEl.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',async ()=>{
        const {toggle:id, pub, hidden} = btn.dataset; const isHidden = hidden==='true', isPub = pub==='true';
        if(isHidden){ alert('強制非公開を解除してから操作してください'); return; }
        await fetch(`/api/admin/providers/${id}`,{method:'PATCH',headers:h(),body:JSON.stringify({published:!isPub})}); load();
      }));
      listEl.querySelectorAll('[data-force-hide]').forEach(btn=>btn.addEventListener('click',async()=>{
        if(!confirm('強制非公開にしますか？')) return;
        await fetch(`/api/admin/providers/${btn.dataset.forceHide}`,{method:'PATCH',headers:h(),body:JSON.stringify({admin_hidden:true})}); load();
      }));
      listEl.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',async()=>{
        if(!confirm(`「${btn.dataset.name}」を完全に削除しますか？\nこの操作は元に戻せません。`)) return;
        const res = await fetch(`/api/admin/providers/${btn.dataset.delete}`,{method:'DELETE',headers:h()});
        if(res.ok){ load(); }
        else{ const err=await res.json(); alert('削除エラー: '+(err.error||'不明')); }
      }));
    }

    function openModal(data){
      form.reset();
      document.getElementById('modal-title').textContent = data?'掲載者を編集':'掲載者を登録';
      document.getElementById('modal-submit').textContent = data?'更新する':'登録する';
      if(data){
        Object.entries(data).forEach(([k,v])=>{ const el=form.elements[k]; if(!el||el.type==='checkbox') return; el.value=v??''; });
        form.querySelectorAll('[name=suitable_triggers]').forEach(cb=>{ cb.checked=(data.suitable_triggers||[]).includes(cb.value); });
        form.querySelectorAll('[name=handles_failure_patterns]').forEach(cb=>{ cb.checked=(data.handles_failure_patterns||[]).includes(cb.value); });
        form.elements['_id'].value = data.id;
      }
      modal.style.display='flex';
    }

    document.getElementById('btn-new').addEventListener('click',()=>openModal(null));
    document.getElementById('modal-close').addEventListener('click',()=>modal.style.display='none');
    document.getElementById('modal-cancel').addEventListener('click',()=>modal.style.display='none');

    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const fd = new FormData(form);
      const data = Object.fromEntries(fd);
      data.suitable_triggers = [...form.querySelectorAll('[name=suitable_triggers]:checked')].map(el=>el.value);
      data.handles_failure_patterns = [...form.querySelectorAll('[name=handles_failure_patterns]:checked')].map(el=>el.value);
      if(data.price_from) data.price_from = Number(data.price_from);
      const id = data._id; delete data._id;
      const res = await fetch(id?`/api/admin/providers/${id}`:'/api/admin/providers',{method:id?'PATCH':'POST',headers:h(),body:JSON.stringify(data)});
      if(res.ok){
        const result = await res.json();
        modal.style.display='none';
        load();
        if(!id && result._init_password){
          alert(`登録完了！\n\n初期パスワード：\n${result._init_password}\n\nこのパスワードをメモしておいてください。\nメールにも同じパスワードが送信されています。`);
        } else if(!id){
          alert('登録完了！\nパスワード情報メールが送信されました。');
        }
      }
      else{ const err=await res.json(); alert('エラー: '+(err.error||'不明')); }
    });

    load();
  })();
  </script>
</body>
</html>
