<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>体験談管理 | Fineme</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="../../assets/styles/style.css" />
  <link rel="stylesheet" href="../../assets/styles/components.css" />
  <style>
    .admin-grid{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
    .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
    .badge-pending{background:#fef3c7;color:#92400e}
    .badge-approved{background:#d1fae5;color:#065f46}
    .badge-rejected{background:#fee2e2;color:#991b1b}
    .filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    .story-grid{display:flex;flex-direction:column;gap:12px}
    .story-card{border:1px solid var(--color-border);border-radius:12px;overflow:hidden;background:#fff}
    .story-card-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f9fafb;border-bottom:1px solid var(--color-border)}
    .story-card-body{padding:16px;display:flex;flex-direction:column;gap:10px}
    .story-q{font-size:11px;font-weight:600;color:#6b7280;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
    .story-a{font-size:14px;line-height:1.7;color:#111;white-space:pre-wrap}
    .story-tags{display:flex;gap:6px;flex-wrap:wrap}
    .story-tag{padding:2px 8px;border-radius:99px;font-size:11px;background:#ede9fe;color:#5b21b6}
    .story-actions{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--color-border);background:#f9fafb}
    @media(max-width:960px){.admin-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main class="section">
    <div class="container admin-grid">
      <aside id="admin-sidebar"></aside>
      <section class="stack">
        <h1 class="section-title">体験談管理</h1>
        <p class="muted">投稿された体験談の審査・承認/却下を行います。</p>

        <!-- サマリ -->
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <div class="card" style="padding:12px 20px;text-align:center;min-width:100px">
            <div style="font-size:24px;font-weight:800" id="cnt-pending">-</div>
            <div class="muted" style="font-size:12px">審査待ち</div>
          </div>
          <div class="card" style="padding:12px 20px;text-align:center;min-width:100px">
            <div style="font-size:24px;font-weight:800" id="cnt-approved">-</div>
            <div class="muted" style="font-size:12px">公開中</div>
          </div>
          <div class="card" style="padding:12px 20px;text-align:center;min-width:100px">
            <div style="font-size:24px;font-weight:800" id="cnt-rejected">-</div>
            <div class="muted" style="font-size:12px">却下済み</div>
          </div>
        </div>

        <div class="card" style="padding:16px">
          <div class="filter-bar">
            <select id="status-filter" onchange="loadStories()">
              <option value="pending">審査待ち</option>
              <option value="approved">公開中</option>
              <option value="rejected">却下済み</option>
              <option value="">すべて</option>
            </select>
            <input id="tag-filter" type="text" placeholder="タグで絞り込み"
              style="min-width:180px" oninput="renderStories()" />
            <button class="btn btn-ghost" onclick="loadStories()">更新</button>
            <span id="load-status" class="muted" style="font-size:12px"></span>
          </div>

          <div id="story-grid" class="story-grid">
            <div class="muted" style="text-align:center;padding:32px">読み込み中...</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
  let allStories = [];

  async function loadStories() {
    const status = document.getElementById('status-filter').value;
    const statusParam = status ? `?status=${status}` : '?status=pending';
    document.getElementById('load-status').textContent = '読み込み中...';

    try {
      // Vercel環境では /api/stories、ローカルでは同じルート
      allStories = await fetch(`/api/stories${statusParam}`).then(r => r.json());
      renderStories();
      updateCounts();
      document.getElementById('load-status').textContent = `${allStories.length}件`;
    } catch(e) {
      document.getElementById('load-status').textContent = 'API接続失敗';
      document.getElementById('story-grid').innerHTML =
        '<div class="muted" style="text-align:center;padding:32px">データを取得できませんでした（Next.js devサーバーが起動しているか確認）</div>';
    }
  }

  async function updateCounts() {
    try {
      const [p, a, r] = await Promise.all([
        fetch('/api/stories?status=pending').then(r=>r.json()),
        fetch('/api/stories?status=approved').then(r=>r.json()),
        fetch('/api/stories?status=rejected').then(r=>r.json()),
      ]);
      document.getElementById('cnt-pending').textContent = p.length;
      document.getElementById('cnt-approved').textContent = a.length;
      document.getElementById('cnt-rejected').textContent = r.length;
    } catch {}
  }

  function renderStories() {
    const tagFilter = document.getElementById('tag-filter').value.toLowerCase();
    const filtered = tagFilter
      ? allStories.filter(s => (Array.isArray(s.tags) ? s.tags.join(',') : (s.tags||'')).toLowerCase().includes(tagFilter))
      : allStories;

    const grid = document.getElementById('story-grid');
    if (!filtered.length) {
      grid.innerHTML = '<div class="muted" style="text-align:center;padding:32px">該当する体験談がありません</div>';
      return;
    }

    const LABELS = ['外見を変える前の悩み', 'どんな変化があったか', '恋愛・人間関係への影響', 'おすすめしたい人'];

    grid.innerHTML = filtered.map(s => {
      // Supabase新フィールド対応
      const tags = Array.isArray(s.tags) ? s.tags : (s.tags||'').split(',').filter(Boolean);
      const answers = [s.concern_before||s.q1, s.change_after||s.q2, s.love_impact||s.q3, s.recommend_to||s.q4];
      const statusBadge = {
        pending: '<span class="badge badge-pending">審査待ち</span>',
        approved: '<span class="badge badge-approved">公開中</span>',
        rejected: '<span class="badge badge-rejected">却下</span>',
      }[s.status] || '';
      const dateStr = (s.created_at||s.createdAt||'').slice(0,10);

      return `
        <div class="story-card" id="story-${s.id}">
          <div class="story-card-header">
            <div style="display:flex;align-items:center;gap:10px">
              ${statusBadge}
              <span class="muted" style="font-size:12px">${dateStr}</span>
              ${s.provider_id ? `<span class="muted" style="font-size:11px">掲載者: ${esc(s.provider_id)}</span>` : ''}
            </div>
            <span class="muted" style="font-size:11px">#${String(s.id).slice(0,8)}</span>
          </div>
          <div class="story-card-body">
            ${answers.map((a, i) => a ? `
              <div>
                <div class="story-q">${LABELS[i]}</div>
                <div class="story-a">${esc(a)}</div>
              </div>
            ` : '').join('')}
            ${tags.length ? `
              <div class="story-tags">
                ${tags.map(t => `<span class="story-tag">${esc(t)}</span>`).join('')}
              </div>
            ` : ''}
          </div>
          <div class="story-actions">
            ${s.status !== 'approved' ? `
              <button class="btn" style="font-size:13px" onclick="updateStatus('${s.id}','approved')">
                ✅ 承認・公開する
              </button>
            ` : ''}
            ${s.status !== 'rejected' ? `
              <button class="btn btn-ghost" style="font-size:13px;color:#ef4444" onclick="updateStatus('${s.id}','rejected')">
                却下する
              </button>
            ` : ''}
            ${s.status !== 'pending' ? `
              <button class="btn btn-ghost" style="font-size:13px" onclick="updateStatus('${s.id}','pending')">
                審査待ちに戻す
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function updateStatus(id, status) {
    try {
      const res = await fetch(`/api/stories/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      if (res.ok) {
        // ローカル状態を更新
        const story = allStories.find(s => s.id === id);
        if (story) story.status = status;
        renderStories();
        updateCounts();
      } else {
        alert('更新に失敗しました');
      }
    } catch(e) {
      alert('API接続失敗: ' + e.message);
    }
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---- 初期化 ----
  loadStories();

  fetch('../../components/admin-sidebar.html').then(r=>r.text()).then(h=>{
    document.getElementById('admin-sidebar').innerHTML = h;
    document.querySelectorAll('#admin-sidebar a').forEach(a => {
      if (a.href.includes('stories')) a.style.fontWeight = '700';
    });
  });
  </script>
</body>
</html>
