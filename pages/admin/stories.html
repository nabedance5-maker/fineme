<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>体験談管理 | Fineme 運営</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="../../assets/styles/style.css" />
  <link rel="stylesheet" href="../../assets/styles/components.css" />
  <style>
    .admin-grid{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
    .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
    .badge-pending{background:#fef3c7;color:#92400e}
    .badge-approved{background:#d1fae5;color:#065f46}
    .badge-rejected{background:#fee2e2;color:#991b1b}
    .tab-nav{display:flex;gap:0;border-bottom:2px solid #e5e7eb;margin-bottom:20px}
    .tab-btn{padding:10px 20px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:600;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s}
    .tab-btn.active{color:#111;border-bottom-color:#111}
    .story-grid{display:flex;flex-direction:column;gap:12px}
    .story-card{border:1px solid var(--color-border);border-radius:12px;overflow:hidden;background:#fff}
    .story-card-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f9fafb;border-bottom:1px solid var(--color-border)}
    .story-card-body{padding:16px;display:flex;flex-direction:column;gap:10px}
    .story-q{font-size:11px;font-weight:600;color:#6b7280;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
    .story-a{font-size:14px;line-height:1.7;color:#111;white-space:pre-wrap}
    .story-tags{display:flex;gap:6px;flex-wrap:wrap}
    .story-tag{padding:2px 8px;border-radius:99px;font-size:11px;background:#ede9fe;color:#5b21b6}
    .story-actions{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--color-border);background:#f9fafb}
    .kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
    .kpi-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;text-align:center}
    .kpi-value{font-size:28px;font-weight:800;color:#111}
    .kpi-label{font-size:12px;color:#6b7280;margin-top:2px}
    @media(max-width:960px){.admin-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main class="section">
    <div class="container admin-grid">
      <aside id="admin-sidebar"></aside>
      <section class="stack">
        <h1 class="section-title">体験談管理</h1>
        <p class="muted">投稿された体験談の審査・承認/却下を行います。</p>

        <!-- サマリ KPI -->
        <div class="kpi-grid">
          <div class="kpi-card"><div class="kpi-value" id="cnt-pending">—</div><div class="kpi-label">審査待ち</div></div>
          <div class="kpi-card"><div class="kpi-value" id="cnt-approved">—</div><div class="kpi-label">公開中</div></div>
          <div class="kpi-card"><div class="kpi-value" id="cnt-rejected">—</div><div class="kpi-label">却下済み</div></div>
        </div>

        <!-- タブ -->
        <div class="tab-nav">
          <button class="tab-btn active" data-tab="pending" id="tab-btn-pending">審査待ち</button>
          <button class="tab-btn" data-tab="approved" id="tab-btn-approved">承認済み</button>
          <button class="tab-btn" data-tab="rejected" id="tab-btn-rejected">却下済み</button>
        </div>

        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
          <button class="btn btn-ghost" id="btn-refresh">更新</button>
          <span id="load-status" class="muted" style="font-size:12px"></span>
        </div>

        <div id="story-grid" class="story-grid">
          <div class="muted" style="text-align:center;padding:32px">読み込み中...</div>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../../scripts/main.js?v=20260312" type="module"></script>
  <script src="../../scripts/partials.js" type="module"></script>
  <script>
  (function(){
    let ADMIN_KEY = sessionStorage.getItem('fineme:admin:key') || '';
    if(!ADMIN_KEY){
      ADMIN_KEY = prompt('管理APIキーを入力してください：') || '';
      if(ADMIN_KEY) sessionStorage.setItem('fineme:admin:key', ADMIN_KEY);
    }

    function h(){ return { 'Content-Type':'application/json', 'x-admin-key': ADMIN_KEY }; }
    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    let allStories = [];
    let currentTab = 'pending';

    const LABELS = ['外見を変える前の悩み', 'どんな変化があったか', '恋愛・人間関係への影響', 'おすすめしたい人'];

    async function loadStories(){
      document.getElementById('load-status').textContent = '読み込み中...';
      document.getElementById('story-grid').innerHTML = '<div class="muted" style="text-align:center;padding:32px">読み込み中...</div>';
      try{
        const res = await fetch(`/api/stories?status=${currentTab}`, { headers: h() });
        if(!res.ok){ document.getElementById('story-grid').innerHTML='<div class="muted" style="text-align:center;padding:32px">取得エラー。APIキーを確認してください。</div>'; document.getElementById('load-status').textContent='エラー'; return; }
        allStories = await res.json();
        renderStories();
        document.getElementById('load-status').textContent = `${allStories.length}件`;
      }catch(e){
        document.getElementById('load-status').textContent = 'API接続失敗';
        document.getElementById('story-grid').innerHTML = '<div class="muted" style="text-align:center;padding:32px">データを取得できませんでした（Next.js devサーバーが起動しているか確認）</div>';
      }
    }

    async function updateCounts(){
      try{
        const [p, a, r] = await Promise.all([
          fetch('/api/stories?status=pending', {headers:h()}).then(r=>r.json()),
          fetch('/api/stories?status=approved', {headers:h()}).then(r=>r.json()),
          fetch('/api/stories?status=rejected', {headers:h()}).then(r=>r.json()),
        ]);
        document.getElementById('cnt-pending').textContent = Array.isArray(p)?p.length:'—';
        document.getElementById('cnt-approved').textContent = Array.isArray(a)?a.length:'—';
        document.getElementById('cnt-rejected').textContent = Array.isArray(r)?r.length:'—';
      }catch{}
    }

    function renderStories(){
      const grid = document.getElementById('story-grid');
      if(!allStories.length){
        grid.innerHTML = '<div class="muted" style="text-align:center;padding:32px">該当する体験談がありません</div>';
        return;
      }
      grid.innerHTML = allStories.map(s=>{
        const tags = Array.isArray(s.tags) ? s.tags : (s.tags||'').split(',').filter(Boolean);
        const answers = [s.concern_before, s.change_after, s.love_impact, s.recommend_to];
        const statusBadge = {
          pending:'<span class="badge badge-pending">審査待ち</span>',
          approved:'<span class="badge badge-approved">公開中</span>',
          rejected:'<span class="badge badge-rejected">却下</span>',
        }[s.status]||'';
        const dateStr = (s.created_at||'').slice(0,10);
        return `
          <div class="story-card" id="story-${esc(s.id)}">
            <div class="story-card-header">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                ${statusBadge}
                <span class="muted" style="font-size:12px">${esc(dateStr)}</span>
                ${s.provider_id?`<span class="muted" style="font-size:11px">掲載者ID: ${esc(s.provider_id)}</span>`:''}
                ${s.service_name?`<span class="muted" style="font-size:11px">「${esc(s.service_name)}」</span>`:''}
              </div>
              <span class="muted" style="font-size:11px">#${esc(String(s.id).slice(0,8))}</span>
            </div>
            <div class="story-card-body">
              ${answers.map((a,i)=>a?`<div><div class="story-q">${LABELS[i]}</div><div class="story-a">${esc(a)}</div></div>`:'').join('')}
              ${tags.length?`<div class="story-tags">${tags.map(t=>`<span class="story-tag">${esc(t)}</span>`).join('')}</div>`:''}
            </div>
            <div class="story-actions">
              ${s.status!=='approved'?`<button class="btn" style="font-size:13px" data-id="${esc(s.id)}" data-action="approved">承認・公開する</button>`:''}
              ${s.status!=='rejected'?`<button class="btn btn-ghost" style="font-size:13px;color:#ef4444" data-id="${esc(s.id)}" data-action="rejected">却下する</button>`:''}
              ${s.status!=='pending'?`<button class="btn btn-ghost" style="font-size:13px" data-id="${esc(s.id)}" data-action="pending">審査待ちに戻す</button>`:''}
            </div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('[data-action]').forEach(btn=>{
        btn.addEventListener('click', ()=> updateStatus(btn.dataset.id, btn.dataset.action));
      });
    }

    async function updateStatus(id, status){
      try{
        const res = await fetch(`/api/stories/${id}`,{
          method:'PATCH',
          headers: h(),
          body: JSON.stringify({status}),
        });
        if(res.ok){
          await loadStories();
          updateCounts();
        } else {
          const err = await res.json().catch(()=>({}));
          alert('更新に失敗しました: '+(err.error||res.status));
        }
      }catch(e){
        alert('API接続失敗: '+e.message);
      }
    }

    // タブ切り替え
    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        loadStories();
      });
    });

    document.getElementById('btn-refresh').addEventListener('click',()=>{
      loadStories();
      updateCounts();
    });

    // 初期化
    loadStories();
    updateCounts();
  })();
  </script>
</body>
</html>
