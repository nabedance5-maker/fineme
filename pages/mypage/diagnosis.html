<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>診断結果 | Fineme マイページ</title>
  <link rel="stylesheet" href="../../assets/styles/style.css?v=20260312" />
  <link rel="stylesheet" href="../../assets/styles/components.css" />
  <style>
    .result-hero {
      padding: 24px; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      border-radius: 16px; margin-bottom: 16px;
    }
    .result-hero h2 { font-size: 18px; font-weight: 800; color: #fff !important; margin: 0 0 6px; line-height: 1.4; }
    .result-hero p { font-size: 13px; color: rgba(255,255,255,.75) !important; margin: 0; line-height: 1.6; }
    .result-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 12px; background: rgba(255,255,255,.2); color: #fff !important; border-radius: 99px; margin-bottom: 10px; }
    .type-badge { display: inline-block; font-size: 13px; font-weight: 800; padding: 6px 16px; border-radius: 99px; margin-bottom: 10px; color: #fff !important; }
    .analysis-block { padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
    .analysis-block:last-child { border-bottom: none; }
    .analysis-label { font-size: 11px; font-weight: 700; color: #6366f1; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 4px; }
    .analysis-text { font-size: 14px; font-weight: 700; color: #111; margin: 0 0 2px; line-height: 1.5; }
    .analysis-sub { font-size: 13px; color: #6b7280; margin: 0; line-height: 1.5; }
    .concern-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .concern-bar-label { font-size: 12px; width: 70px; flex-shrink: 0; color: #374151; }
    .concern-bar-track { flex: 1; height: 6px; background: #f3f4f6; border-radius: 99px; overflow: hidden; }
    .concern-bar-fill { height: 100%; border-radius: 99px; }
    .concern-bar-value { font-size: 11px; font-weight: 700; width: 40px; text-align: right; flex-shrink: 0; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; gap: 8px; }
    .history-item:last-child { border-bottom: none; }
    .history-date { font-size: 12px; color: #9ca3af; }
    .history-type { font-size: 13px; font-weight: 700; color: #374151; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media(max-width:480px){ .action-grid { grid-template-columns: 1fr; } }
    .action-btn {
      display: block; text-align: center; padding: 13px 16px;
      border-radius: 12px; font-size: 14px; font-weight: 700;
      text-decoration: none; transition: opacity .15s;
    }
    .action-btn:hover { opacity: .85; }
    .action-btn-primary { background: #111; color: #fff !important; }
    .action-btn-secondary { background: #fff; color: #111 !important; border: 1.5px solid #e5e7eb; }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main class="section">
    <div class="container mypage-layout">
      <aside id="mypage-sidenav"></aside>
      <section class="stack">
        <h1 class="section-title">診断結果</h1>
        <div id="diag-host" class="stack"></div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../../scripts/main.js?v=20260312" type="module"></script>
  <script src="../../scripts/partials.js" type="module"></script>
  <script type="module">
    import { requireUserAuth } from '../../scripts/user-auth.js';
    requireUserAuth();
  </script>
  <script>
  (function(){
    const STORAGE_KEY = 'fineme:diagnosis:latest';
    const HISTORY_KEY = 'fineme:diagnosis:history';
    const host = document.getElementById('diag-host');

    const LEVEL_TEXT = ['全然','少し','そこそこ','かなり','すごく'];
    const CONCERN_ICONS = {
      hair:'💇‍♂️', skin:'✨', eyebrow:'✂️', body:'💪', fashion:'👔',
      beard:'💈', teeth_whitening:'🦷', teeth_alignment:'😬', teeth_odor:'💨',
      posture:'🚶', overall:'🪞'
    };
    const CONCERN_NAMES = {
      hair:'髪型・髪', skin:'肌・ニキビ', eyebrow:'眉毛', body:'体型・体', fashion:'服・コーデ',
      beard:'ひげ', teeth_whitening:'歯の黄ばみ', teeth_alignment:'歯並び', teeth_odor:'口臭',
      posture:'姿勢', overall:'トータルで整えたい'
    };

    // v8（care_levels形式）→ concern_areas に変換
    function careLevelsToConcernAreas(careLevels){
      const map = { concerned:4, self:3, pro:2 };
      const out = {};
      Object.entries(careLevels||{}).forEach(([id,lv])=>{
        if(map[lv]) out[id] = map[lv];
      });
      return out;
    }

    function levelColor(l){ return ['#e5e7eb','#93c5fd','#60a5fa','#3b82f6','#2563eb'][l]||'#e5e7eb'; }

    function getConcernType(areas){
      const high = Object.entries(areas).filter(([,v])=>v>=3);
      const facial = ['eyebrow','skin','photo'].filter(k=>(areas[k]||0)>=3);
      const bodyStyle = ['body','fashion'].filter(k=>(areas[k]||0)>=3);
      const hasOverall = (areas.overall||0)>=2;
      const topArea = [...Object.entries(areas)].sort(([,a],[,b])=>b-a)[0];
      if(high.length===0 && Object.values(areas).every(v=>v<=1)) return { type:'メンテナンス型', color:'#059669' };
      if(hasOverall && high.length>=3) return { type:'全面リニューアル型', color:'#7c3aed' };
      if(facial.length>=2) return { type:'第一印象・顔まわり集中型', color:'#2563eb' };
      if(bodyStyle.length>=2) return { type:'ボディ×スタイル型', color:'#d97706' };
      if((areas.hair||0)>=3 && facial.length>=1) return { type:'清潔感底上げ型', color:'#0891b2' };
      if(topArea && topArea[1]>=3){
        const map = { hair:{type:'髪型特化型',color:'#2563eb'}, skin:{type:'肌ケア特化型',color:'#0891b2'}, eyebrow:{type:'眉毛特化型',color:'#2563eb'}, body:{type:'ボディメイク型',color:'#d97706'}, fashion:{type:'スタイリング型',color:'#7c3aed'}, photo:{type:'写真映り特化型',color:'#0891b2'}, overall:{type:'全体印象型',color:'#7c3aed'} };
        return map[topArea[0]] || { type:'変容準備型', color:'#2563eb' };
      }
      return { type:'変容準備型', color:'#2563eb' };
    }

    function getTriggerLabel(t){ return {
      matching_app:'マッチングアプリで結果を出したい',
      matching_photo:'マッチングアプリで写真が原因で損している',
      matching_date:'マッチングはできるが会うと続かない',
      love:'好きな人ができた',love_now:'好きな人ができた・次に会う時に印象を変えたい',
      career:'就職・転職・大事な場面',mirror:'毎朝鏡を見るたびに気分が上がらない',
      word:'誰かの一言が頭から離れない',comparison:'同世代と並んだとき差を感じた',
      vague:'ずっと気になっていた'
    }[t]||t||'—'; }
    function getStyleLabel(s){ return {explanation:'納得してから動くタイプ',consultation:'相談しながら進めるタイプ',delegate:'任せて結果を出してほしいタイプ',cautious:'小さく試してから続けるタイプ'}[s]||s||'—'; }
    function getUrgencyLabel(u){ return {high:'1ヶ月以内に変化を感じたい',mid:'2〜3ヶ月で',low:'半年〜1年で',continuous:'継続できるものがいい'}[u]||u||'—'; }
    function getFailureLabel(f){ return {lost_direction:'方向がわからなくなった',no_continuation:'続かなかった',cost:'コストが続かなかった',awkward:'関係性がうまくいかなかった',no_result:'変化が感じられなかった',ongoing:'今も継続中'}[f]||f||'—'; }

    function fmtDate(ts){ try{ return new Date(ts).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch{ return ''; } }

    function renderV4(p){
      const areas = p.concern_areas || {};
      const concernType = getConcernType(areas);
      const concernSorted = Object.entries(areas).sort(([,a],[,b])=>b-a);

      // Hero
      const hero = document.createElement('div');
      hero.className = 'result-hero';
      hero.innerHTML = `
        <div class="result-badge">最新の診断結果</div>
        <div><span class="type-badge" style="background:${concernType.color}">${concernType.type}</span></div>
        <p>${fmtDate(p.at)} 実施 ${p.stage2_completed ? '（詳細版）' : '（簡易版）'}</p>
      `;
      host.appendChild(hero);

      // 気になり度
      if(concernSorted.filter(([,v])=>v>0).length > 0){
        const card = document.createElement('div'); card.className='card'; card.style.padding='20px';
        const h2 = document.createElement('h2'); h2.textContent='📊 気になり度マップ'; h2.style.margin='0 0 14px'; card.appendChild(h2);
        concernSorted.forEach(([id,level])=>{
          const row = document.createElement('div'); row.className='concern-bar-row';
          row.innerHTML = `
            <div class="concern-bar-label">${CONCERN_ICONS[id]||''} ${CONCERN_NAMES[id]||id}</div>
            <div class="concern-bar-track"><div class="concern-bar-fill" style="width:${Math.round((level/4)*100)}%;background:${levelColor(level)}"></div></div>
            <div class="concern-bar-value" style="color:${levelColor(level)}">${LEVEL_TEXT[level]||''}</div>
          `;
          card.appendChild(row);
        });
        host.appendChild(card);
      }

      // プロファイル
      const profileCard = document.createElement('div'); profileCard.className='card'; profileCard.style.padding='20px';
      const ph2 = document.createElement('h2'); ph2.textContent='🧭 あなたのプロファイル'; ph2.style.margin='0 0 14px'; profileCard.appendChild(ph2);
      const rows = [
        p.trigger && ['きっかけ', getTriggerLabel(p.trigger)],
        p.style && ['進め方', getStyleLabel(p.style)],
        p.urgency && ['タイムライン', getUrgencyLabel(p.urgency)],
        p.failure_pattern && ['過去のパターン', getFailureLabel(p.failure_pattern)],
      ].filter(Boolean);
      rows.forEach(([label, value])=>{
        const block = document.createElement('div'); block.className='analysis-block';
        block.innerHTML = `<div class="analysis-label">${label}</div><div class="analysis-text">${value}</div>`;
        profileCard.appendChild(block);
      });
      host.appendChild(profileCard);

      // アクション
      const actionCard = document.createElement('div'); actionCard.className='card'; actionCard.style.padding='20px';
      actionCard.innerHTML = `
        <div class="action-grid">
          <a href="../../index.html?scrollTo=roadmap" class="action-btn action-btn-primary">変容ロードマップを見る</a>
          <a href="../search.html?diag=1" class="action-btn action-btn-secondary">サービスを探す</a>
          <a href="../diagnosis.html" class="action-btn action-btn-secondary">再診断する</a>
          <a href="../diagnosis-result.html" class="action-btn action-btn-secondary">詳細な結果を見る</a>
        </div>
      `;
      host.appendChild(actionCard);
    }

    function renderHistory(){
      const raw = localStorage.getItem(HISTORY_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(arr) || arr.length < 2) return;
      const histArr = arr.slice().reverse();
      const card = document.createElement('div'); card.className='card'; card.style.padding='20px';
      const h2 = document.createElement('h2'); h2.textContent='📅 診断履歴'; h2.style.margin='0 0 14px'; card.appendChild(h2);
      histArr.slice(0, 10).forEach((item, i)=>{
        const p = item.profile || item;
        const areas = p.concern_areas || {};
        const ct = getConcernType(areas);
        const row = document.createElement('div'); row.className='history-item';
        row.innerHTML = `
          <div>
            <div class="history-type">${ct.type}</div>
            <div class="history-date">${fmtDate(p.at || item.at)}</div>
          </div>
          ${i===0 ? '<span style="font-size:11px;font-weight:700;padding:2px 8px;background:#dbeafe;color:#1d4ed8;border-radius:99px">最新</span>' : ''}
        `;
        card.appendChild(row);
      });
      host.appendChild(card);
    }

    function renderEmpty(){
      const card = document.createElement('div'); card.className='card'; card.style.padding='20px';
      card.innerHTML = `
        <p class="muted">診断結果がまだありません。</p>
        <div class="action-grid" style="margin-top:14px">
          <a href="../diagnosis.html" class="action-btn action-btn-primary">診断する（5〜8分）</a>
          <a href="../search.html" class="action-btn action-btn-secondary">診断せずに探す</a>
        </div>
      `;
      host.appendChild(card);
    }

    // メイン
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){ renderEmpty(); return; }
      const p = JSON.parse(raw);
      // v5〜v8（care_levels形式）はconcern_areasに変換して表示
      if(['v5','v6','v7','v8'].includes(p.version)){
        if(!p.concern_areas || Object.keys(p.concern_areas).length === 0){
          p.concern_areas = careLevelsToConcernAreas(p.care_levels);
        }
        renderV4(p);
        renderHistory();
      } else if(p.version === 'v4'){
        renderV4(p);
        renderHistory();
      } else {
        // 本当に古い形式（v1〜v3）
        const card = document.createElement('div'); card.className='card'; card.style.padding='20px';
        card.innerHTML = `
          <p style="font-weight:700;margin:0 0 8px">診断データを更新してください</p>
          <p class="muted" style="margin:0 0 14px">新しい変容プロファイル診断を受けると、より詳細な分析が表示されます。</p>
          <a href="../diagnosis.html" class="action-btn action-btn-primary" style="display:inline-block;padding:12px 24px">新しい診断を受ける</a>
        `;
        host.appendChild(card);
      }
    }catch(e){
      renderEmpty();
    }
  })();
  </script>
</body>
</html>
