<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>診断結果 | Fineme</title>
  <link rel="stylesheet" href="../../assets/styles/style.css" />
  <link rel="stylesheet" href="../../assets/styles/components.css" />
  <style>
    .diag-badge {
      display: inline-block;
      font-size: 12px; font-weight: 800;
      padding: 4px 14px;
      background: #111; color: #fff;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    .diag-result-heading {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 800;
      line-height: 1.4;
      margin: 0 0 8px;
    }
    .diag-result-sub {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.7;
      margin: 0 0 20px;
    }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    @media (max-width: 480px) {
      .score-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .score-cell {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .score-cell-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .score-cell-val {
      font-size: 22px; font-weight: 800; color: #111;
      line-height: 1;
    }
    .score-cell-val.is-low { color: #4f46e5; }
    .score-cell-sub { font-size: 10px; color: #9ca3af; margin-top: 2px; }

    .priority-list { list-style: none; padding: 0; margin: 0; }
    .priority-item {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .priority-item:last-child { border-bottom: none; }
    .priority-num {
      width: 24px; height: 24px; min-width: 24px;
      border-radius: 50%;
      background: #111; color: #fff;
      font-size: 12px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .priority-title { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
    .priority-desc  { font-size: 13px; color: #6b7280; line-height: 1.6; margin: 0; }

    .phase-summary {
      display: flex; gap: 8px; align-items: center;
      padding: 12px 16px;
      background: #f4f4ff;
      border-radius: 10px;
      border-left: 3px solid #4f46e5;
      margin-bottom: 0;
    }
    .phase-summary-icon { font-size: 20px; }
    .phase-summary-text { font-size: 14px; font-weight: 600; color: #1e1b4b; }
    .phase-summary-sub  { font-size: 12px; color: #6b7280; margin-top: 2px; }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main class="section">
    <div class="container mypage-layout">
      <aside id="mypage-sidenav"></aside>
      <section class="stack">
        <h1 class="section-title">診断結果</h1>
        <div id="diag-host" class="stack"></div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../../scripts/main.js" type="module"></script>
  <script src="../../scripts/partials.js" type="module"></script>
  <script type="module">
    import { requireUserAuth } from '../../scripts/user-auth.js';
    requireUserAuth();
  </script>
  <script>
  (function(){
    const DIAG_KEY     = 'fineme:diagnosis:v2';
    const OLD_KEY      = 'fineme:diagnosis:latest';
    const PROGRESS_KEY = 'fineme:roadmap:progress';
    const host         = document.getElementById('diag-host');

    const ITEM_LABELS = {
      eyebrow: '眉', hair: '髪', body: '体型', skin: '肌',
      hair_removal: 'ムダ毛', teeth: '歯', nail: '爪', makeup: 'メイク',
    };
    const ITEM_ICONS = {
      eyebrow: '✏️', hair: '💈', body: '💪', skin: '🧴',
      hair_removal: '⚡', teeth: '😁', nail: '💅', makeup: '✨',
    };
    const PHASE_LABELS = {
      1: 'Phase 1 — 清潔感の土台を作る段階',
      2: 'Phase 2 — 印象を引き上げる段階',
      3: 'Phase 3 — 全体を仕上げる段階',
    };

    function fmtDate(ts) {
      try { return new Date(ts).toLocaleString('ja-JP'); } catch { return ''; }
    }
    function getCurrentPhase() {
      try {
        const p = JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
        if (p.phase2_complete) return 3;
        if (p.phase1_complete) return 2;
        return 1;
      } catch { return 1; }
    }

    function renderNew(diag) {
      const { scores, result, savedAt } = diag;
      const currentPhase = getCurrentPhase();

      // ── ヘッダーカード ──
      const card1 = document.createElement('div');
      card1.className = 'card';
      card1.style.padding = '20px';

      const badge = document.createElement('div');
      badge.className = 'diag-badge';
      badge.textContent = result?.badge || '診断済み';

      const heading = document.createElement('h2');
      heading.className = 'diag-result-heading';
      heading.textContent = result?.heading || '外見診断が完了しています';

      const sub = document.createElement('p');
      sub.className = 'diag-result-sub';
      sub.textContent = result?.sub || '';

      if (savedAt) {
        const ts = document.createElement('p');
        ts.className = 'muted';
        ts.style.fontSize = '12px';
        ts.style.marginBottom = '16px';
        ts.textContent = `診断日時: ${fmtDate(savedAt)}`;
        card1.appendChild(badge);
        card1.appendChild(heading);
        card1.appendChild(sub);
        card1.appendChild(ts);
      } else {
        card1.appendChild(badge);
        card1.appendChild(heading);
        card1.appendChild(sub);
      }

      // ── スコア一覧 ──
      if (scores && Object.keys(scores).length > 0) {
        const scoreTitle = document.createElement('p');
        scoreTitle.style.cssText = 'font-size:12px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;';
        scoreTitle.textContent = '現在のスコア';
        card1.appendChild(scoreTitle);

        const grid = document.createElement('div');
        grid.className = 'score-grid';
        const keys = ['eyebrow','hair','body','skin','hair_removal','teeth','nail','makeup'];
        keys.forEach(k => {
          const val = scores[k];
          if (val == null) return;
          const cell = document.createElement('div');
          cell.className = 'score-cell';
          cell.innerHTML = `
            <div class="score-cell-label">${ITEM_ICONS[k] || ''} ${ITEM_LABELS[k] || k}</div>
            <div class="score-cell-val${val <= 5 ? ' is-low' : ''}">${val}</div>
            <div class="score-cell-sub">/10</div>`;
          grid.appendChild(cell);
        });
        card1.appendChild(grid);
      }

      // ── フェーズ状況 ──
      const phaseSummary = document.createElement('div');
      phaseSummary.className = 'phase-summary';
      phaseSummary.innerHTML = `
        <div class="phase-summary-icon">🗺️</div>
        <div>
          <div class="phase-summary-text">${PHASE_LABELS[currentPhase]}</div>
          <div class="phase-summary-sub">現在取り組むべき段階です</div>
        </div>`;
      card1.appendChild(phaseSummary);

      host.appendChild(card1);

      // ── 優先取り組みTOP3 ──
      const priorities = result?.priorities;
      if (priorities && priorities.length > 0) {
        const card2 = document.createElement('div');
        card2.className = 'card';
        card2.style.padding = '20px';
        const h3 = document.createElement('h3');
        h3.style.cssText = 'font-size:15px;font-weight:800;margin:0 0 12px;';
        h3.textContent = '今すぐ取り組む TOP 3';
        card2.appendChild(h3);

        const ul = document.createElement('ul');
        ul.className = 'priority-list';
        priorities.slice(0, 3).forEach((p, i) => {
          const li = document.createElement('li');
          li.className = 'priority-item';
          li.innerHTML = `
            <div class="priority-num">${i + 1}</div>
            <div>
              <p class="priority-title">${p.title || ''}</p>
              <p class="priority-desc">${p.desc || ''}</p>
            </div>`;
          ul.appendChild(li);
        });
        card2.appendChild(ul);
        host.appendChild(card2);
      }

      // ── アクション ──
      const card3 = document.createElement('div');
      card3.className = 'card';
      card3.style.cssText = 'padding:20px;display:flex;flex-wrap:wrap;gap:10px;';
      card3.innerHTML = `
        <a href="../../index.html?scrollTo=roadmap" class="btn btn-ghost" style="flex:1;min-width:160px;text-align:center;">
          ロードマップを見る
        </a>
        <a href="../diagnosis.html" class="btn btn-ghost" style="flex:1;min-width:160px;text-align:center;">
          診断をやり直す
        </a>
        <a href="../search.html" class="btn btn-ghost" style="flex:1;min-width:160px;text-align:center;">
          サービスを探す
        </a>`;
      host.appendChild(card3);
    }

    function renderRediagnose() {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = 'padding:24px;text-align:center;';
      card.innerHTML = `
        <div style="font-size:32px;margin-bottom:12px;">🗺️</div>
        <h2 style="font-size:17px;font-weight:800;margin:0 0 8px;">診断データを更新してください</h2>
        <p class="muted" style="font-size:14px;line-height:1.7;margin:0 0 20px;">
          以前の診断データは旧形式のため、詳細なスコアを読み込めません。<br>
          もう一度診断すると、スコア・ロードマップがすべて表示されます。
        </p>
        <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">
          <a href="../diagnosis.html" class="btn" style="font-size:14px;padding:10px 28px;">
            診断をやり直す（1分）
          </a>
          <a href="../search.html" class="btn btn-ghost" style="font-size:14px;padding:10px 28px;">
            診断せずに探す
          </a>
        </div>`;
      host.appendChild(card);
    }

    function renderEmpty() {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = 'padding:24px;text-align:center;';
      card.innerHTML = `
        <div style="font-size:32px;margin-bottom:12px;">📋</div>
        <h2 style="font-size:17px;font-weight:800;margin:0 0 8px;">診断がまだ完了していません</h2>
        <p class="muted" style="font-size:14px;line-height:1.7;margin:0 0 20px;">
          診断を完了すると、あなた専用のロードマップとスコアがここに表示されます。
        </p>
        <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">
          <a href="../diagnosis.html" class="btn" style="font-size:14px;padding:10px 28px;">
            無料で診断する（1分）
          </a>
          <a href="../search.html" class="btn btn-ghost" style="font-size:14px;padding:10px 28px;">
            診断せずに探す
          </a>
        </div>`;
      host.appendChild(card);
    }

    try {
      const raw = localStorage.getItem(DIAG_KEY);
      const diag = raw ? JSON.parse(raw) : null;
      const hasNew = diag && diag.scores && Object.keys(diag.scores).length >= 1;

      if (hasNew) {
        renderNew(diag);
      } else if (localStorage.getItem(OLD_KEY)) {
        renderRediagnose();
      } else {
        renderEmpty();
      }
    } catch(e) {
      renderEmpty();
    }
  })();
  </script>
</body>
</html>
