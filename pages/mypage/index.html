<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>マイページ | Fineme</title>
  <link rel="stylesheet" href="../../assets/styles/style.css" />
  <link rel="stylesheet" href="../../assets/styles/components.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="section">
    <div class="container mypage-layout">
      <aside id="mypage-sidenav"></aside>
      <section class="stack">
        <h1 class="section-title">マイページ</h1>
        <p class="muted">予約履歴・お気に入り・閲覧履歴・プロフィール編集が利用できます。</p>
        <div class="card" style="padding:16px">
          <h2>予約状況</h2>
          <div id="mypage-resv-summary"><p class="muted">読み込み中…</p></div>
          <div class="cluster" style="gap:8px;margin-top:12px">
            <a href="/search" class="btn" style="color:#111 !important">サービスを探す</a>
            <a href="/pages/mypage/reservations.html" class="btn btn-ghost">予約履歴を見る</a>
          </div>
        </div>
        <div class="card" style="padding:16px">
          <h2>あなたの目的</h2>
          <div id="mypage-goal-content" class="cluster" style="gap:8px;flex-wrap:wrap"></div>
        </div>
        <div>
          <button id="mypage-signout" class="btn btn-ghost">ログアウト</button>
        </div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../../scripts/main.js?v=20260312" type="module"></script>
  <script src="../../scripts/partials.js" type="module"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { requireUserAuth, signOutUser } from '../../scripts/user-auth.js';
    const s = requireUserAuth();

    // Supabase予約サマリー
    const sb = createClient(
      'https://qsfpzlvucqzmjldshwwd.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzZnB6bHZ1Y3F6bWpsZHNod3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5ODM1MzIsImV4cCI6MjA4ODU1OTUzMn0.9mBlP8-0l9jotex_UkX7Ba8ZodYtailaxoK_RIy3Kq8'
    );
    (async () => {
      const summaryEl = document.getElementById('mypage-resv-summary');
      if (!summaryEl) return;
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session?.user?.email) { summaryEl.innerHTML = '<p class="muted">ログイン中ではありません。</p>'; return; }
        const res = await fetch('/api/reservations/by-contact?contact=' + encodeURIComponent(session.user.email));
        if (!res.ok) throw new Error('fetch failed');
        const items = await res.json();
        if (!items.length) { summaryEl.innerHTML = '<p class="muted">まだ予約はありません。</p>'; return; }
        const pending = items.filter(r=>r.status==='pending').length;
        const counter = items.filter(r=>r.status==='counter_proposed').length;
        const approved = items.filter(r=>r.status==='approved').length;
        let html = '<p style="margin:0 0 6px;font-size:14px">予約: <strong>' + items.length + '件</strong></p>';
        if (counter > 0) html += '<p style="margin:0 0 4px;font-size:13px;color:#6366f1;font-weight:700">📋 代替提案あり: ' + counter + '件 → 確認が必要です</p>';
        if (pending > 0) html += '<p style="margin:0 0 4px;font-size:13px;color:#f59e0b">⏳ 返答待ち: ' + pending + '件</p>';
        if (approved > 0) html += '<p style="margin:0;font-size:13px;color:#10b981">✓ 承認済み: ' + approved + '件</p>';
        summaryEl.innerHTML = html;
      } catch(e) {
        summaryEl.innerHTML = '<p class="muted">予約状況を取得できませんでした。</p>';
      }
    })();
    const btn = document.getElementById('mypage-signout');
    if(btn) btn.addEventListener('click', ()=> signOutUser());
    // 保存された目的に合わせたCTA
    try{
      const saved = localStorage.getItem('fineme:goal:category');
      const host = document.getElementById('mypage-goal-content');
      if(saved && host){
        const map = { consulting:'コンサル/相談', gym:'パーソナルジム', makeup:'メイク', hair:'美容室', diagnosis:'診断', fashion:'ファッション', photo:'写真/撮影', marriage:'婚活/印象', eyebrow:'眉', hairremoval:'脱毛', esthetic:'エステ', cosmetic:'美容外科・美容クリニック', whitening:'ホワイトニング', orthodontics:'矯正', nail:'ネイル' };
        const label = map[saved] || saved;
        const ttl = document.createElement('div'); ttl.className='muted'; ttl.textContent = `保存された目的：${label}`; host.appendChild(ttl);
        const btnGo = document.createElement('a'); btnGo.className='btn'; btnGo.textContent = `${label}で探す`; btnGo.href = `/pages/search.html?category=${encodeURIComponent(saved)}`; host.appendChild(btnGo);
        const btnStarter = document.createElement('a'); btnStarter.className='btn btn-ghost'; btnStarter.textContent = 'タイプに合うスターター3選'; btnStarter.href = '/pages/search.html?diag=1&top=3&origin=mypage'; host.appendChild(btnStarter);
        const btnQuickToday = document.createElement('a'); btnQuickToday.className='btn btn-ghost'; btnQuickToday.textContent = '今日行ける'; btnQuickToday.href = '/pages/search.html?quick=today'; host.appendChild(btnQuickToday);
        const btnQuickWeekend = document.createElement('a'); btnQuickWeekend.className='btn btn-ghost'; btnQuickWeekend.textContent = '週末行ける'; btnQuickWeekend.href = '/pages/search.html?quick=weekend'; host.appendChild(btnQuickWeekend);
      }
    }catch{}
  </script>
</body>
</html>
