<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>予約履歴 | Fineme</title>
  <link rel="stylesheet" href="../../assets/styles/style.css" />
  <link rel="stylesheet" href="../../assets/styles/components.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="section">
    <div class="container mypage-layout">
      <aside id="mypage-sidenav"></aside>
      <section class="stack">
        <h1 class="section-title">予約履歴</h1>
        <div id="counter-banner" style="display:none;padding:14px 18px;background:#eef2ff;border:1.5px solid #818cf8;border-radius:12px;margin-bottom:16px;font-weight:700;color:#4f46e5;font-size:14px;">
          📋 代替日時の提案が届いています。下記から確認・承認してください。
        </div>
        <div id="reservations-container">
          <p class="muted">読み込み中...</p>
        </div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../../scripts/main.js" type="module"></script>
  <script src="../../scripts/partials.js" type="module"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { requireUserAuth } from '../../scripts/user-auth.js';
    requireUserAuth();

    const sb = createClient(
      'https://qsfpzlvucqzmjldshwwd.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzZnB6bHZ1Y3F6bWpsZHNod3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5ODM1MzIsImV4cCI6MjA4ODU1OTUzMn0.9mBlP8-0l9jotex_UkX7Ba8ZodYtailaxoK_RIy3Kq8'
    );

    const STATUS_LABELS = {
      pending:'返答待ち', approved:'承認済み', rejected:'お断り',
      counter_proposed:'代替提案あり', visited:'来店確認済み',
      cancelled:'キャンセル済み', expired:'期限切れ'
    };
    const STATUS_COLORS = {
      pending:'#f59e0b', approved:'#10b981', rejected:'#ef4444',
      counter_proposed:'#6366f1', visited:'#059669', cancelled:'#9ca3af', expired:'#9ca3af'
    };

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function fmtDate(d){ if(!d) return ''; try{ return new Date(d).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}); }catch{ return String(d); } }
    function fmtRemaining(expiresAt) {
      if (!expiresAt) return '';
      const diff = new Date(expiresAt) - new Date();
      if (diff <= 0) return '期限切れ';
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      if (h >= 1) return '残り ' + h + '時間' + (m > 0 ? m + '分' : '');
      return '残り ' + m + '分';
    }

    let currentContact = '';

    async function loadReservations(contact) {
      currentContact = contact;
      const container = document.getElementById('reservations-container');
      container.innerHTML = '<p class="muted">読み込み中...</p>';

      const res = await fetch('/api/reservations/by-contact?contact=' + encodeURIComponent(contact));
      if (!res.ok) { container.innerHTML = '<p class="muted" style="color:#ef4444">取得できませんでした。</p>'; return; }
      const items = await res.json();

      document.getElementById('counter-banner').style.display = items.some(r=>r.status==='counter_proposed') ? 'block' : 'none';

      if (!items.length) {
        container.innerHTML = '<div style="text-align:center;padding:50px 20px;border:1px dashed #d1d5db;border-radius:12px"><p style="font-size:28px;margin:0 0 10px">📭</p><p style="font-weight:700;color:#374151;margin:0 0 4px">予約履歴がありません</p><p style="font-size:13px;color:#6b7280;margin:0">サービスページから予約リクエストを送ってみましょう</p></div>';
        return;
      }

      container.innerHTML = '<p class="muted" style="margin:0 0 12px">' + items.length + '件</p>';

      items.forEach(function(r) {
        var color = STATUS_COLORS[r.status] || '#6b7280';
        var label = STATUS_LABELS[r.status] || r.status;
        var menuMatch = (r.note||'').match(/\u300cメニュー\u300d([^\n]+)/);
        if (!menuMatch) menuMatch = (r.note||'').match(/【メニュー】([^\n]+)/);
        var menuText = menuMatch ? menuMatch[1] : '';
        var userMsg = (r.note||'')
          .replace(/【メニュー】[^\n]*/g,'')
          .replace(/【第[23]希望】\d{4}-\d{2}-\d{2}\s+\d{1,2}:\d{2}/g,'')
          .trim();

        var extraHtml = '';

        if (r.status==='approved' && r.confirmed_date) {
          extraHtml += '<div style="padding:12px 16px;background:#f0fdf4;border:1px solid #86efac;border-radius:10px;margin-top:10px"><p style="font-size:12px;font-weight:700;color:#15803d;margin:0 0 4px">✓ 確定日時</p><p style="font-size:15px;font-weight:800;color:#15803d;margin:0">' + fmtDate(r.confirmed_date) + ' ' + esc(r.confirmed_time||'') + '</p></div>';
        }

        if (r.status==='counter_proposed') {
          var remaining = fmtRemaining(r.counter_expires_at);
          var isUrgent = r.counter_expires_at && (new Date(r.counter_expires_at) - new Date()) < 3 * 3600000;
          var remainHtml = remaining ? '<p style="font-size:12px;font-weight:700;color:'+(isUrgent?'#ef4444':'#6b7280')+';margin:0 0 10px">⏰ '+ remaining +'に自動キャンセル</p>' : '';
          extraHtml += '<div style="padding:14px 16px;background:#eef2ff;border:1.5px solid #818cf8;border-radius:10px;margin-top:12px">'
            + '<p style="font-size:12px;font-weight:700;color:#4f46e5;margin:0 0 6px">📋 掲載者から代替日時の提案があります</p>'
            + '<p style="font-size:16px;font-weight:800;color:#4f46e5;margin:0 0 8px">' + fmtDate(r.counter_date) + ' ' + esc(r.counter_time||'') + '</p>'
            + (r.provider_comment ? '<p style="font-size:13px;color:#374151;margin:0 0 8px">' + esc(r.provider_comment) + '</p>' : '')
            + remainHtml
            + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
            + '<button style="padding:10px 20px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer" data-action="accept" data-id="' + r.id + '" data-cdate="' + esc(r.counter_date||'') + '" data-ctime="' + esc(r.counter_time||'') + '">この日時で承認する</button>'
            + '<button style="padding:10px 16px;background:#fff;color:#6b7280;border:1.5px solid #e5e7eb;border-radius:10px;font-size:13px;cursor:pointer" data-action="cancel" data-id="' + r.id + '">キャンセル</button>'
            + '</div></div>';
        }

        if (r.status==='rejected' && r.provider_comment) {
          extraHtml += '<div style="padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin-top:10px;font-size:13px">掲載者より: ' + esc(r.provider_comment) + '</div>';
        }

        var cancelBtn = r.status==='pending'
          ? '<div style="margin-top:10px"><button style="padding:7px 14px;background:#fff;color:#6b7280;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;cursor:pointer" data-action="cancel" data-id="' + r.id + '">リクエストをキャンセル</button></div>'
          : '';

        var borderColor = r.status==='counter_proposed' ? '#818cf8' : '#e5e7eb';
        var bg = r.status==='counter_proposed' ? '#fafafe' : '#fff';
        var provLink = r.provider_slug ? '/provider/' + r.provider_slug : '#';

        var card = document.createElement('div');
        card.style.cssText = 'border:1.5px solid ' + borderColor + ';border-radius:14px;padding:18px;margin-bottom:12px;background:' + bg;
        card.innerHTML =
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px">'
          + '<div><a href="' + provLink + '" style="font-size:16px;font-weight:800;color:#111;text-decoration:none">' + esc(r.provider_name||'掲載者') + '</a>'
          + '<p style="font-size:12px;color:#9ca3af;margin:2px 0 0">' + fmtDate(r.created_at) + ' 送信</p></div>'
          + '<span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:' + color + '20;color:' + color + '">' + label + '</span>'
          + '</div>'
          + '<p style="font-size:13px;color:#6b7280;margin:0 0 6px">📅 第1希望: ' + esc(r.reserved_date||'—') + ' ' + esc(r.start_time||'') + '</p>'
          + (menuText ? '<p style="font-size:13px;font-weight:700;color:#374151;margin:0 0 8px">🎯 ' + esc(menuText) + '</p>' : '')
          + (userMsg ? '<div style="font-size:13px;color:#374151;padding:8px 12px;background:#f9fafb;border-radius:8px;margin-bottom:8px">' + esc(userMsg) + '</div>' : '')
          + extraHtml + cancelBtn;

        container.appendChild(card);
      });

      container.querySelectorAll('[data-action]').forEach(function(btn) {
        btn.addEventListener('click', async function() {
          var action = btn.dataset.action, id = btn.dataset.id;
          if (action==='accept') {
            btn.disabled = true; btn.textContent = '処理中…';
            var res = await fetch('/api/reservations/' + id, {
              method:'PATCH', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ status:'approved', confirmed_date:btn.dataset.cdate, confirmed_time:btn.dataset.ctime })
            });
            if (res.ok) loadReservations(currentContact);
            else { var e=await res.json().catch(function(){return{};}); alert('エラー: '+(e.error||res.status)); btn.disabled=false; btn.textContent='この日時で承認する'; }
          } else if (action==='cancel') {
            if (!confirm('キャンセルしますか？')) return;
            btn.disabled = true; btn.textContent = '処理中…';
            var res = await fetch('/api/reservations/' + id, {
              method:'PATCH', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ status:'cancelled' })
            });
            if (res.ok) loadReservations(currentContact);
            else { var e=await res.json().catch(function(){return{};}); alert('エラー: '+(e.error||res.status)); btn.disabled=false; }
          }
        });
      });
    }

    (async function() {
      try {
        var session = (await sb.auth.getSession()).data.session;
        if (session && session.user && session.user.email) {
          loadReservations(session.user.email);
        } else {
          document.getElementById('reservations-container').innerHTML = '<p class="muted">ログインして予約履歴を確認してください。</p>';
        }
      } catch(e) {
        console.error(e);
        document.getElementById('reservations-container').innerHTML = '<p class="muted" style="color:#ef4444">読み込みエラーが発生しました。</p>';
      }
    })();
  </script>
</body>
</html>
