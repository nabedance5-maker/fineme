<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>掲載者ログイン | Fineme</title>
  <link rel="stylesheet" href="../assets/styles/style.css?v=20260312" />
  <link rel="stylesheet" href="../assets/styles/components.css" />
  <meta name="robots" content="noindex,nofollow" />
  <style>
    .login-wrap { max-width: 420px; margin: 60px auto; padding: 0 20px; }
    .login-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; padding: 32px; box-shadow: 0 4px 24px rgba(2,6,23,.06); }
    .login-card h1 { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
    .login-card .sub { font-size: 14px; color: #6b7280; margin: 0 0 24px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .form-field label { font-size: 12px; font-weight: 700; color: #374151; }
    .form-field input { padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 15px; width: 100%; box-sizing: border-box; transition: border-color .15s; }
    .form-field input:focus { outline: none; border-color: #2563eb; }
    .login-btn { width: 100%; padding: 14px; background: #111; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: opacity .15s; }
    .login-btn:hover { opacity: .85; }
    .login-btn:disabled { opacity: .4; cursor: not-allowed; }
    .err-msg { color: #ef4444; font-size: 13px; margin: 8px 0 0; }
    .ok-msg { color: #059669; font-size: 13px; margin: 8px 0 0; }
    .forgot-link { font-size: 13px; color: #6366f1; cursor: pointer; text-decoration: underline; background: none; border: none; }
    .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; color: #d1d5db; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="login-wrap">
      <div class="login-card">

        <!-- ログインフォーム -->
        <div id="view-login">
          <h1>掲載者ログイン</h1>
          <p class="sub">登録されたメールアドレスとパスワードを入力してください</p>
          <div class="form-field">
            <label>メールアドレス</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-field">
            <label>パスワード</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <p id="login-error" class="err-msg" style="display:none"></p>
          <button class="login-btn" id="login-btn">ログイン</button>
          <div style="text-align:right;margin-top:12px">
            <button class="forgot-link" id="show-forgot">パスワードを忘れた方はこちら</button>
          </div>
        </div>

        <!-- パスワード再設定フォーム -->
        <div id="view-forgot" style="display:none">
          <h1>パスワードを忘れた方へ</h1>
          <p class="sub">登録済みのメールアドレスを入力すると、パスワード再設定メールをお送りします。</p>
          <div class="form-field">
            <label>メールアドレス</label>
            <input type="email" id="reset-email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <p id="reset-error" class="err-msg" style="display:none"></p>
          <p id="reset-ok" class="ok-msg" style="display:none"></p>
          <button class="login-btn" id="reset-btn">再設定メールを送る</button>
          <div style="text-align:center;margin-top:14px">
            <button class="forgot-link" id="show-login">ログインに戻る</button>
          </div>
        </div>

      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../scripts/main.js?v=20260312" type="module"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://qsfpzlvucqzmjldshwwd.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzZnB6bHZ1Y3F6bWpsZHNod3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5ODM1MzIsImV4cCI6MjA4ODU1OTUzMn0.9mBlP8-0l9jotex_UkX7Ba8ZodYtailaxoK_RIy3Kq8';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);
    const SITE_URL = 'https://fineme.me';

    // ── ログイン ──────────────────────────────────────────────
    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';

      if (!email || !password) { errEl.textContent = 'メールアドレスとパスワードを入力してください'; errEl.style.display = 'block'; return; }

      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'ログイン中…';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        console.error('[login error]', error.message, error);
        errEl.textContent = `ログインエラー: ${error.message}`;
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'ログイン';
        return;
      }

      // 掲載者かチェック
      const res = await fetch('/api/provider/me', {
        headers: { 'Authorization': `Bearer ${data.session.access_token}` }
      });

      if (res.ok) {
        window.location.href = '/pages/provider/index.html';
      } else {
        // 掲載者ではない場合はマイページへ
        window.location.href = '/pages/mypage/index.html';
      }
    });

    // Enterキーでログイン
    ['email','password'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('login-btn').click();
      });
    });

    // ── パスワード再設定 ──────────────────────────────────────
    document.getElementById('show-forgot').addEventListener('click', () => {
      document.getElementById('view-login').style.display = 'none';
      document.getElementById('view-forgot').style.display = 'block';
    });
    document.getElementById('show-login').addEventListener('click', () => {
      document.getElementById('view-forgot').style.display = 'none';
      document.getElementById('view-login').style.display = 'block';
    });

    document.getElementById('reset-btn').addEventListener('click', async () => {
      const email = document.getElementById('reset-email').value.trim();
      const errEl = document.getElementById('reset-error');
      const okEl = document.getElementById('reset-ok');
      errEl.style.display = 'none'; okEl.style.display = 'none';

      if (!email) { errEl.textContent = 'メールアドレスを入力してください'; errEl.style.display = 'block'; return; }

      const btn = document.getElementById('reset-btn');
      btn.disabled = true; btn.textContent = '送信中…';

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${SITE_URL}/pages/auth/callback.html`,
      });

      btn.disabled = false; btn.textContent = '再設定メールを送る';

      if (error) {
        errEl.textContent = '送信に失敗しました: ' + error.message;
        errEl.style.display = 'block';
      } else {
        okEl.textContent = 'パスワード再設定メールを送りました。メールを確認してください。';
        okEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
