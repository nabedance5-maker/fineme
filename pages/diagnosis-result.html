<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断結果 | Fineme</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/components.css">
  <style>
    .result-wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }

    .result-hero {
      padding: 32px 24px 28px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .result-badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      padding: 4px 14px; background: rgba(255,255,255,.18);
      color: #fff !important;
      border-radius: 99px; margin-bottom: 14px; letter-spacing: .06em;
    }
    .result-hero h1 {
      font-size: clamp(18px,4vw,24px); font-weight: 800; margin: 0 0 10px;
      line-height: 1.45; color: #ffffff !important;
    }
    .result-hero p {
      font-size: 14px; color: rgba(255,255,255,0.75) !important;
      margin: 0; line-height: 1.7;
    }

    .result-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
      padding: 24px; margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(2,6,23,.05);
    }
    .result-card-title {
      font-size: 15px; font-weight: 800; margin: 0 0 16px;
      display: flex; align-items: center; gap: 8px;
    }

    /* Analysis sections */
    .analysis-block { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid #f3f4f6; }
    .analysis-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .analysis-label {
      font-size: 11px; font-weight: 700; color: #6366f1;
      text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px;
    }
    .analysis-text { font-size: 15px; font-weight: 700; color: #111; line-height: 1.6; margin: 0 0 4px; }
    .analysis-sub { font-size: 13px; color: #6b7280; line-height: 1.6; margin: 0; }

    /* Priority item */
    .priority-box {
      background: linear-gradient(135deg, #eff6ff, #eef2ff);
      border: 1.5px solid #bfdbfe;
      border-radius: 14px; padding: 20px;
      margin-bottom: 14px;
    }
    .priority-label { font-size: 11px; font-weight: 700; color: #2563eb; letter-spacing: .06em; margin: 0 0 6px; }
    .priority-main { font-size: 17px; font-weight: 800; color: #111; margin: 0 0 6px; }
    .priority-reason { font-size: 13px; color: #374151; line-height: 1.6; margin: 0; }

    /* Concern bars */
    .concern-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .concern-bar-label { font-size: 12px; width: 72px; flex-shrink: 0; color: #374151; display: flex; align-items: center; gap: 4px; }
    .concern-bar-track { flex: 1; height: 8px; background: #f3f4f6; border-radius: 99px; overflow: hidden; }
    .concern-bar-fill { height: 100%; border-radius: 99px; transition: width .8s ease .2s; }
    .concern-bar-value { font-size: 12px; font-weight: 700; width: 40px; text-align: right; flex-shrink: 0; }

    /* Recommend cards */
    .recommend-card {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px;
      margin-bottom: 10px; text-decoration: none; color: inherit;
      transition: border-color .12s, background .12s;
    }
    .recommend-card:hover { border-color: #2563eb; background: rgba(37,99,235,.03); }
    .recommend-card.top { border-color: #bfdbfe; background: #eff6ff; }
    .recommend-card-icon { font-size: 26px; flex-shrink: 0; }
    .recommend-card-body { flex: 1; }
    .recommend-card-title { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
    .recommend-card-reason { font-size: 12px; color: #6b7280; }
    .recommend-card-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; background: #dbeafe; color: #1d4ed8; border-radius: 99px; white-space: nowrap; }

    /* Provider match hint */
    .match-hint {
      background: #f9fafb; border-radius: 12px; padding: 16px;
      font-size: 13px; color: #374151; line-height: 1.6;
    }
    .match-hint strong { color: #111; }

    /* CTA */
    .cta-block { text-align: center; padding: 8px 0; }
    .cta-block .btn { font-size: 17px; padding: 15px 32px; display: inline-block; }

    /* Stage 2 prompt */
    .stage2-prompt {
      border: 1.5px solid #e0e7ff; background: #f5f7ff;
      border-radius: 14px; padding: 20px;
    }
    .stage2-prompt h3 { font-size: 15px; font-weight: 800; color: #4f46e5; margin: 0 0 8px; }
    .stage2-prompt p { font-size: 13px; color: #6b7280; margin: 0 0 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="result-wrap">
      <div id="result-root">
        <p style="text-align:center;padding:60px 20px;color:#9ca3af">読み込み中…</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../scripts/main.js" type="module"></script>
  <script>
  (function(){
    const STORAGE_KEY = 'fineme:diagnosis:latest';
    const root = document.getElementById('result-root');

    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      root.innerHTML = '<div style="text-align:center;padding:60px 20px"><p style="color:#6b7280">診断データが見つかりませんでした。</p><a href="./diagnosis.html" class="btn" style="margin-top:16px;display:inline-block">診断する</a></div>';
      return;
    }
    let p;
    try{ p = JSON.parse(raw); }catch(e){ root.innerHTML = '<div style="text-align:center;padding:60px 20px"><p>エラーが発生しました。</p><a href="./diagnosis.html" class="btn" style="margin-top:16px;display:inline-block">再診断する</a></div>'; return; }

    // ── 分析エンジン ──────────────────────────────────────────────────

    // 1. 現状の核心（trigger × scene → 状況の言語化）
    function getCoreSituation(){
      const t = p.trigger, s = p.scene;
      if(t==='matching_app' && s==='photo') return {
        text:'マッチングアプリで写真が不利になっている。',
        sub:'外見そのものより「写真映り」の問題の可能性が高い。今の状態を整えたうえで、プロに撮ってもらうことで解決するケースが多い。'
      };
      if(t==='matching_app' && s==='first_impression') return {
        text:'マッチングアプリでマッチングしても、会った瞬間に差がつく。',
        sub:'写真で伝わらない「実物の印象」を上げることが課題。清潔感・全体感を整えることで、会った瞬間の第一印象が変わる。'
      };
      if(t==='matching_app') return {
        text:'マッチングアプリで結果が出ていない状態。外見が足を引っ張っている可能性がある。',
        sub:'顔の印象・清潔感・写真映りのどこかに改善できる点があるはず。診断した気になり度の高い部分から着手することで、最短で変化を出せる。'
      };
      if(t==='love' && s==='first_impression') return {
        text:'好きな人がいて、第一印象で良く思われたい。',
        sub:'恋愛における外見の役割は、「好意を生む」より「障壁をなくす」こと。印象を下げている要因を一つ取り除くだけで、相手との距離感が変わる。'
      };
      if(t==='love') return {
        text:'好きな人がいる、または関係を進めたいという明確な動機がある。',
        sub:'動機がある今が、変わるための最大のチャンス。この気持ちが薄れないうちに、最初の一歩を踏み出すことが大事。'
      };
      if(t==='career') return {
        text:'大事な場面に向けて、外見を整えておく必要がある。',
        sub:'面接・転職・節目といった場面は、外見への意識が一番高まるタイミング。この機会を使って、その後も通用する外見の土台を作ることができる。'
      };
      if(t==='word') return {
        text:'何かの一言が引っかかっている。その感覚は正しい。',
        sub:'「なんか違う」という違和感は、変われるサインだ。その一言が指している部分を特定して、そこだけ変えればいい。全部変えなくていい。'
      };
      return {
        text:'ずっと気になっていたことが、今動くきっかけになっている。',
        sub:'「いつかやろう」が「今やる」に変わった瞬間を、ムダにしないことが大事。まず一点だけ変えると、次が見えてくる。'
      };
    }

    // 2. 壁の分析（failure_pattern × style → なぜ変われなかったか）
    function getBarrierAnalysis(){
      const f = p.failure_pattern, s = p.style;
      if(!f) return null;
      if(f==='lost_direction') return {
        text:'「何をすればいいかわからない」状態で止まる傾向がある。',
        sub:'これは意志の問題ではなく、プログラムの設計の問題。週ごとの目標が明確で、次のステップが常に見えているプロと組むことで、この壁は乗り越えられる。',
        condition: '明確な構造を持った、ステップバイステップで進めてくれるプロ'
      };
      if(f==='no_continuation') return {
        text:'効果を感じながらも、続かなかった経験がある。',
        sub:'続かない理由の多くは「ハードルが高すぎる」か「一人でやろうとした」ことにある。月1〜2回でも継続できる環境と、定期的に関わってくれるプロが解決策になる。',
        condition: '負担が小さく始められて、継続サポートが得意なプロ'
      };
      if(f==='cost') return {
        text:'コストや時間の面で続けられなかった経験がある。',
        sub:'費用対効果の高い始め方をすることが鍵。まず1点だけ変える。その変化が実感できたら次に進む。一気に全部やろうとすると、コストで詰まる。',
        condition: '小さく始められる体験メニューがある、または単価が明確なプロ'
      };
      if(f==='awkward') return {
        text:'プロとの関係性でつまずいた経験がある。',
        sub:'押し付けられる感覚・空気感・やり取りの違和感がストレスになって離れるパターンは多い。「相性」を最初から重視できるプロを選ぶことが、今回の最優先事項。',
        condition: '押し売りせず、こちらのペースを尊重してくれるプロ'
      };
      if(f==='no_result') return {
        text:'変化が感じられずに諦めた経験がある。',
        sub:'変化が見えない理由は、「合っていないサービスを選んでいた」か「評価方法を知らなかった」かのどちらかが多い。今回の診断で、あなたに合うカテゴリを先に絞ることで、これを回避する。',
        condition: 'before/afterが明確で、変化を可視化してくれるプロ'
      };
      if(f==='ongoing') return {
        text:'今も継続中。さらに深化させる段階にいる。',
        sub:'基礎は出来ている。次はそれを「統合」する段階。バラバラに磨いてきたパーツを全体として活かす外見コンサルや、出会いの場への活用が次のステップになる。',
        condition: '総合的な外見プロデュースができるプロ'
      };
      return null;
    }

    // 3. 優先取り組み（気になり度の最高部位 × urgency）
    function getPriorityAction(){
      const areas = p.concern_areas || {};
      const ICONS = { hair:'💇‍♂️', skin:'✨', eyebrow:'✂️', body:'💪', fashion:'👔', photo:'📸', overall:'🪞' };
      const NAMES = { hair:'髪型・髪', skin:'肌・ニキビ', eyebrow:'眉毛', body:'体型・体', fashion:'服・コーデ', photo:'写真写り', overall:'全体の雰囲気' };
      const CATS = { hair:'hair', skin:'esthetic', eyebrow:'eyebrow', body:'gym', fashion:'fashion', photo:'photo', overall:'consulting' };
      const COPY = {
        hair:'髪型は第一印象の30%を占める。ここを変えると、すれ違っただけで「なんかいい感じ」に見える。',
        skin:'肌の状態は近距離で一番差が出る。清潔感の土台であり、ここを整えると全体の印象が底上げされる。',
        eyebrow:'眉毛は顔の印象を一番早く変えられる。1回のサロンで、別人のような第一印象になる。',
        body:'体型は服の見え方を全部変える。ここが変わると、持っている服がすべて「ちゃんとして見える」ようになる。',
        fashion:'服・コーデは「清潔感があるかどうか」の差がすべて。サイズ感と色を整えるだけで、印象が大きく変わる。',
        photo:'写真映りの問題は、実物がどれだけよくても解決しない。プロに撮ってもらうことで、マッチングの結果が変わる。',
        overall:'パーツ単位で見ても改善しにくい状態。外見コンサルで全体像を把握してから動くのが一番効率的。',
      };
      const sorted = Object.entries(areas).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a);
      if(sorted.length === 0) return null;
      const [topId, topLevel] = sorted[0];
      const urgencyNote = p.urgency === 'high' ? '締め切りがある今、ここが最短ルート。' : '';
      return {
        icon: ICONS[topId] || '🎯',
        name: NAMES[topId] || topId,
        copy: (COPY[topId] || '') + (urgencyNote ? ' ' + urgencyNote : ''),
        cat: CATS[topId] || 'consulting',
        level: topLevel
      };
    }

    // 4. 合うプロの特徴（style × relationship × failure_pattern）
    function getProviderProfile(){
      const s = p.style, r = p.relationship, f = p.failure_pattern;
      const traits = [];
      if(s==='explanation') traits.push('「なぜそうするのか」を丁寧に説明してくれる');
      if(s==='consultation') traits.push('こちらの意見を聞きながら一緒に進めてくれる');
      if(s==='delegate') traits.push('任せたら確実に結果を出してくれる・無駄な話が少ない');
      if(s==='cautious') traits.push('小さく始められる体験メニューがある');
      if(r==='continuity') traits.push('毎回前回の続きから始めてくれる・記録してくれる');
      if(r==='directive') traits.push('やることをはっきり指示してくれる');
      if(r==='accessibility') traits.push('予約以外でも気軽に相談できる（LINE等）');
      if(r==='autonomy') traits.push('押し売りしない・こちらのペースを尊重する');
      if(f==='lost_direction') traits.push('プログラムが明確・週ごとの目標がある');
      if(f==='no_continuation') traits.push('無理なく続けられるペースを提案してくれる');
      if(f==='awkward') traits.push('空気感がよく、話しやすい');
      return [...new Set(traits)].slice(0, 4);
    }

    // 5. おすすめカテゴリ（気になり度TOP3）
    function getRecommendations(){
      const areas = p.concern_areas || {};
      const MAP = {
        hair: { icon:'💇‍♂️', label:'ヘア・美容院', cat:'hair', why:'髪型が気になっている' },
        skin: { icon:'💆‍♂️', label:'肌・エステ', cat:'esthetic', why:'肌の状態が気になっている' },
        eyebrow: { icon:'✂️', label:'眉毛サロン', cat:'eyebrow', why:'眉毛・顔まわりが気になっている' },
        body: { icon:'🏋️‍♂️', label:'パーソナルジム', cat:'gym', why:'体型・体のつくりが気になっている' },
        fashion: { icon:'👔', label:'ファッション', cat:'fashion', why:'服・コーデを見直したい' },
        photo: { icon:'📸', label:'プロフィール写真', cat:'photo', why:'写真写りを改善したい' },
        overall: { icon:'🧑‍⚕️', label:'外見トータルサポート', cat:'consulting', why:'全体的な垢抜けを目指している' }
      };
      return Object.entries(areas).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).slice(0,3).map(([id])=>MAP[id]).filter(Boolean);
    }

    // 6. 気になり度バーのグラデーション
    function levelColor(level){
      const colors = ['#e5e7eb','#93c5fd','#60a5fa','#3b82f6','#2563eb'];
      return colors[level] || colors[0];
    }
    const LEVEL_TEXT = ['全然','少し','そこそこ','かなり','すごく'];
    const CONCERN_ICONS = { hair:'💇‍♂️', skin:'✨', eyebrow:'✂️', body:'💪', fashion:'👔', photo:'📸', overall:'🪞' };
    const CONCERN_NAMES = { hair:'髪型・髪', skin:'肌・ニキビ', eyebrow:'眉毛', body:'体型・体', fashion:'服・コーデ', photo:'写真写り', overall:'全体の雰囲気' };

    // ── 生成 ────────────────────────────────────────────────────────────
    const situation = getCoreSituation();
    const barrier = getBarrierAnalysis();
    const priority = getPriorityAction();
    const providerTraits = getProviderProfile();
    const recs = getRecommendations();
    const concerns = Object.entries(p.concern_areas||{}).filter(([,v])=>v>=0).sort(([,a],[,b])=>b-a);

    const heroSub = barrier
      ? `${barrier.text.replace('。','')}\u3002あなたに合う条件のプロを優先して表示します。`
      : `診断結果をもとに、合う可能性の高いサービスを優先して表示します。`;

    const html = `
      <div class="result-hero">
        <div class="result-badge">診断完了</div>
        <h1>${situation.text}</h1>
        <p>${situation.sub}</p>
      </div>

      ${priority ? `
      <div class="priority-box">
        <div class="priority-label">▶ 今すぐ取り組むべき1点</div>
        <div class="priority-main">${priority.icon} ${priority.name}</div>
        <div class="priority-reason">${priority.copy}</div>
      </div>` : ''}

      ${barrier ? `
      <div class="result-card">
        <div class="result-card-title">🔍 変われなかった理由と、変わるための条件</div>
        <div class="analysis-block">
          <div class="analysis-label">パターン</div>
          <div class="analysis-text">${barrier.text}</div>
          <div class="analysis-sub">${barrier.sub}</div>
        </div>
        ${barrier.condition ? `
        <div class="match-hint">
          今回おすすめするのは：<strong>${barrier.condition}</strong>
        </div>` : ''}
      </div>` : ''}

      ${concerns.length > 0 ? `
      <div class="result-card">
        <div class="result-card-title">📊 気になり度マップ</div>
        ${concerns.map(([id, level]) => `
          <div class="concern-bar-row">
            <div class="concern-bar-label">
              ${CONCERN_ICONS[id]||''} ${CONCERN_NAMES[id]||id}
            </div>
            <div class="concern-bar-track">
              <div class="concern-bar-fill" style="width:${Math.round((level/4)*100)}%;background:${levelColor(level)}"></div>
            </div>
            <div class="concern-bar-value" style="color:${levelColor(level)}">${LEVEL_TEXT[level]||''}</div>
          </div>
        `).join('')}
      </div>` : ''}

      ${providerTraits.length > 0 ? `
      <div class="result-card">
        <div class="result-card-title">🤝 あなたに合うプロの特徴</div>
        ${providerTraits.map(t => `
          <div class="analysis-block">
            <div class="analysis-text" style="font-size:14px">✓ ${t}</div>
          </div>
        `).join('')}
        <p style="font-size:12px;color:#9ca3af;margin:10px 0 0">掲載者のページでこの条件との一致度を表示します。</p>
      </div>` : ''}

      ${recs.length > 0 ? `
      <div class="result-card">
        <div class="result-card-title">🎯 おすすめカテゴリ</div>
        ${recs.map((r,i) => `
          <a href="./search.html?category=${r.cat}&diag=1" class="recommend-card${i===0?' top':''}">
            <span class="recommend-card-icon">${r.icon}</span>
            <span class="recommend-card-body">
              <div class="recommend-card-title">${r.label}</div>
              <div class="recommend-card-reason">${r.why}</div>
            </span>
            ${i===0?'<span class="recommend-card-badge">最優先</span>':''}
          </a>
        `).join('')}
      </div>` : ''}

      ${!p.stage2_completed ? `
      <div class="stage2-prompt">
        <h3>💡 精度をもっと上げませんか？</h3>
        <p>過去の試みや理想の関係性まで答えると、「なぜ変われなかったか」の分析が加わり、さらに的確なプロを提案できます。</p>
        <a href="./diagnosis.html" class="btn" style="display:inline-block;font-size:14px">続きを答える（あと4問）</a>
      </div>` : ''}

      <div class="cta-block" style="margin-top:20px">
        <p style="font-size:14px;color:#6b7280;margin:0 0 14px">あなたに合うサービスを探す</p>
        <a href="./search.html?diag=1" class="btn">サービスをすべて見る</a>
      </div>
      <div style="text-align:center;margin-top:14px">
        <a href="/" style="font-size:13px;color:#9ca3af">トップページへ戻る（変容ロードマップを見る）</a>
      </div>
    `;

    root.innerHTML = html;
  })();
  </script>
</body>
</html>
