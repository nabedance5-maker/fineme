<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診断結果 | Fineme</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/components.css">
  <style>
    .result-wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ─── Hero ─────────────────────────────── */
    .result-hero {
      padding: 40px 28px 36px;
      background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 60%, #0f2354 100%);
      border-radius: 22px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .result-hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(99,102,241,.18) 0%, transparent 70%);
      border-radius: 50%;
    }
    .result-hero::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 160px; height: 160px;
      background: radial-gradient(circle, rgba(37,99,235,.12) 0%, transparent 70%);
      border-radius: 50%;
    }
    .result-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700;
      padding: 5px 14px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff !important;
      border-radius: 99px;
      margin-bottom: 18px;
      letter-spacing: .08em;
      position: relative; z-index: 1;
    }
    .result-badge::before { content: '●'; font-size: 7px; color: #4ade80; }
    .result-hero h1 {
      font-size: clamp(18px,4.5vw,26px);
      font-weight: 900;
      margin: 0 0 14px;
      line-height: 1.4;
      color: #ffffff !important;
      letter-spacing: -.01em;
      position: relative; z-index: 1;
    }
    .result-hero h1 em {
      font-style: normal;
      color: #a5b4fc !important;
    }
    .result-hero-sub {
      font-size: 14px;
      color: rgba(255,255,255,.75) !important;
      margin: 0;
      line-height: 1.75;
      position: relative; z-index: 1;
    }
    .result-hero-sub strong {
      color: rgba(255,255,255,.95) !important;
      font-weight: 700;
    }
    .result-hero-divider {
      width: 40px; height: 2px;
      background: linear-gradient(90deg, #6366f1, transparent);
      margin: 16px 0;
      position: relative; z-index: 1;
    }

    /* ─── Section label ─────────────────────── */
    .section-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #9ca3af;
      margin: 0 0 20px;
      padding-left: 2px;
    }

    /* ─── Priority card ─────────────────────── */
    .priority-card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 24px rgba(37,99,235,.12), 0 1px 4px rgba(2,6,23,.06);
      border: 1.5px solid #bfdbfe;
      position: relative;
      overflow: hidden;
    }
    .priority-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #2563eb, #6366f1);
    }
    .priority-card-eyebrow {
      font-size: 11px; font-weight: 700;
      color: #2563eb; letter-spacing: .08em;
      margin: 0 0 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .priority-card-eyebrow::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: #2563eb;
      border-radius: 50%;
    }
    .priority-card-main {
      font-size: 22px; font-weight: 900;
      color: #111; margin: 0 0 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .priority-card-reason {
      font-size: 14px; color: #374151;
      line-height: 1.7; margin: 0;
    }
    .priority-card-cta {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 16px; padding: 10px 18px;
      background: #111; color: #fff !important;
      border-radius: 10px; font-size: 13px; font-weight: 700;
      text-decoration: none;
      transition: opacity .15s;
    }
    .priority-card-cta:hover { opacity: .82; }

    /* ─── Standard card ─────────────────────── */
    .result-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(2,6,23,.05);
    }
    .result-card-header {
      margin: 0 0 6px;
    }
    .result-card-title {
      font-size: 16px; font-weight: 800;
      color: #111; margin: 0 0 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .result-card-subtitle {
      font-size: 12px; color: #6b7280;
      margin: 0 0 18px; line-height: 1.5;
    }

    /* ─── Type badge ──────────────────────── */
    .type-badge-wrap { margin-bottom: 14px; }
    .type-badge {
      display: inline-block; font-size: 13px; font-weight: 800;
      padding: 8px 20px;
      color: #fff;
      border-radius: 99px;
      margin-bottom: 12px;
    }
    .type-desc-box {
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 14px; color: #374151;
      line-height: 1.75;
    }

    /* ─── Concern bars ────────────────────── */
    .concern-bars { margin-top: 18px; display: flex; flex-direction: column; gap: 11px; }
    .concern-bar-row { display: flex; align-items: center; gap: 12px; }
    .concern-bar-label {
      font-size: 12px; font-weight: 600;
      width: 82px; flex-shrink: 0;
      color: #374151;
      display: flex; align-items: center; gap: 5px;
    }
    .concern-bar-track {
      flex: 1; height: 10px;
      background: #f1f5f9;
      border-radius: 99px; overflow: hidden;
    }
    .concern-bar-fill {
      height: 100%; border-radius: 99px;
      transition: width 1s cubic-bezier(.4,0,.2,1) .3s;
    }
    .concern-bar-value {
      font-size: 12px; font-weight: 700;
      width: 46px; text-align: right; flex-shrink: 0;
    }

    /* ─── Insight cards ───────────────────── */
    .insight-list { display: flex; flex-direction: column; gap: 12px; }
    .insight-item {
      padding: 16px 18px;
      border-radius: 12px;
      border-left: 4px solid #2563eb;
      background: #f8faff;
    }
    .insight-label {
      font-size: 10px; font-weight: 800;
      color: #2563eb; margin: 0 0 5px;
      text-transform: uppercase; letter-spacing: .08em;
    }
    .insight-text { font-size: 14px; font-weight: 800; color: #111; margin: 0 0 4px; line-height: 1.5; }
    .insight-sub { font-size: 13px; color: #6b7280; margin: 0; line-height: 1.65; }

    /* ─── Trait list ──────────────────────── */
    .trait-list { display: flex; flex-direction: column; gap: 10px; }
    .trait-item {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 14px; color: #374151; line-height: 1.55;
      padding: 12px 14px;
      background: #f9fafb; border-radius: 10px;
    }
    .trait-check {
      width: 20px; height: 20px;
      background: #dbeafe; color: #2563eb;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; flex-shrink: 0; margin-top: 1px;
    }

    /* ─── Recommend cards ─────────────────── */
    .recommend-card {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border: 1.5px solid #e5e7eb; border-radius: 14px;
      margin-bottom: 10px; text-decoration: none; color: inherit;
      transition: border-color .12s, box-shadow .12s, background .12s;
    }
    .recommend-card:hover { border-color: #2563eb; box-shadow: 0 2px 12px rgba(37,99,235,.1); }
    .recommend-card.top { border-color: #bfdbfe; background: #eff6ff; }
    .recommend-card-icon { font-size: 28px; flex-shrink: 0; }
    .recommend-card-body { flex: 1; }
    .recommend-card-title { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
    .recommend-card-reason { font-size: 12px; color: #6b7280; }
    .recommend-card-badge {
      font-size: 11px; font-weight: 700;
      padding: 4px 10px;
      background: #2563eb; color: #fff;
      border-radius: 99px; white-space: nowrap;
    }

    /* ─── Stage2 deepdive ─────────────────── */
    .deepdive-section {
      background: linear-gradient(135deg, #f5f7ff 0%, #eef2ff 100%);
      border: 1.5px solid #e0e7ff;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .deepdive-title {
      font-size: 15px; font-weight: 800; color: #4f46e5;
      margin: 0 0 6px;
    }
    .deepdive-desc {
      font-size: 13px; color: #6b7280;
      margin: 0 0 18px; line-height: 1.65;
    }
    .deepdive-items { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .deepdive-item {
      background: #fff; border-radius: 12px;
      padding: 14px 16px;
      display: flex; align-items: flex-start; gap: 12px;
      border: 1px solid #e0e7ff;
    }
    .deepdive-item-icon {
      width: 36px; height: 36px;
      background: #eef2ff; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .deepdive-item-body { flex: 1; }
    .deepdive-item-if { font-size: 11px; font-weight: 700; color: #6366f1; margin: 0 0 3px; letter-spacing: .04em; }
    .deepdive-item-then { font-size: 13px; font-weight: 700; color: #111; margin: 0; line-height: 1.45; }
    .deepdive-arrow {
      font-size: 11px; font-weight: 800;
      color: #6366f1; white-space: nowrap;
      flex-shrink: 0; margin-top: 11px;
    }

    /* ─── CTA section ─────────────────────── */
    .cta-block {
      background: #fff; border: 1px solid #e5e7eb;
      border-radius: 18px; padding: 28px 24px;
      margin-top: 8px;
      box-shadow: 0 2px 12px rgba(2,6,23,.05);
    }
    .cta-block-title { font-size: 16px; font-weight: 800; color: #111; margin: 0 0 4px; }
    .cta-block-desc { font-size: 13px; color: #6b7280; margin: 0 0 20px; line-height: 1.6; }
    .cta-section { display: flex; flex-direction: column; gap: 10px; }
    .cta-btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 16px 20px;
      background: #111; color: #fff !important;
      font-size: 16px; font-weight: 700;
      border-radius: 14px; text-decoration: none;
      transition: opacity .15s;
    }
    .cta-btn-primary:hover { opacity: .85; }
    .cta-btn-primary::after { content: '→'; font-weight: 900; }
    .cta-btn-secondary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px;
      background: #fff; color: #111 !important;
      font-size: 15px; font-weight: 700;
      border: 1.5px solid #e5e7eb; border-radius: 14px; text-decoration: none;
      transition: border-color .12s;
      cursor: pointer;
    }
    .cta-btn-secondary:hover { border-color: #2563eb; }
    .cta-btn-ghost {
      display: block; text-align: center; padding: 10px 20px;
      color: #9ca3af !important; font-size: 13px; text-decoration: none;
    }
    .cta-btn-ghost:hover { color: #374151 !important; }
    .cta-divider {
      height: 1px; background: #f3f4f6; margin: 4px 0;
    }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="result-wrap">
      <div id="result-root">
        <p style="text-align:center;padding:60px 20px;color:#9ca3af">読み込み中…</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../scripts/main.js" type="module"></script>
  <script>
  (function(){
    const STORAGE_KEY = 'fineme:diagnosis:latest';
    const root = document.getElementById('result-root');

    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      root.innerHTML = '<div style="text-align:center;padding:60px 20px"><p style="color:#6b7280">診断データが見つかりませんでした。</p><a href="./diagnosis.html" class="btn" style="margin-top:16px;display:inline-block">診断する</a></div>';
      return;
    }
    let p;
    try{ p = JSON.parse(raw); }catch(e){
      root.innerHTML = '<div style="text-align:center;padding:60px 20px"><p>エラーが発生しました。</p><a href="./diagnosis.html" class="btn" style="margin-top:16px;display:inline-block">再診断する</a></div>';
      return;
    }

    // ────────────────────────────────────────────────────────────────
    // 定数
    // ────────────────────────────────────────────────────────────────
    const areas = p.concern_areas || {};
    const LEVEL_TEXT  = ['全然','少し','そこそこ','かなり','すごく'];
    const LEVEL_TEXT_FULL = ['気にならない','少し気になる','そこそこ気になる','かなり気になる','すごく気になる'];
    const CONCERN_ICONS = { hair:'💇‍♂️', skin:'✨', eyebrow:'✂️', body:'💪', fashion:'👔', photo:'📸', overall:'🪞' };
    const CONCERN_NAMES = { hair:'髪型・髪', skin:'肌・ニキビ', eyebrow:'眉毛', body:'体型・体', fashion:'服・コーデ', photo:'写真映り', overall:'全体の雰囲気' };

    // ────────────────────────────────────────────────────────────────
    // 1. ヒーロー文（深化版）trigger × scene 全組み合わせ
    // ────────────────────────────────────────────────────────────────
    function getCoreSituation(){
      const t = p.trigger;
      const s = p.scene;

      // matching_app × scene
      if(t === 'matching_app' && s === 'photo') return {
        h1: '<em>頑張っているのに、結果が変わらない。</em><br>その理由は、もう見えている。',
        sub: '写真の中の自分が、あなたの魅力を正確に伝えていない。外見の問題ではなく「<strong>写し方</strong>」の問題だ。実物を整えて、プロに撮ってもらう。たった2ステップで、マッチング数は変わる。'
      };
      if(t === 'matching_app' && s === 'first_impression') return {
        h1: '<em>マッチングできても、会った瞬間に終わる。</em><br>その壁は、取り除ける。',
        sub: '写真でOKが出ても実物で冷める——それは「見た目の差」ではなく「<strong>清潔感の積み重ね</strong>」の差だ。顔まわりと全体感を整えると、会った瞬間の空気が変わる。'
      };
      if(t === 'matching_app' && s === 'fashion') return {
        h1: '<em>努力しているのに、評価されない。</em><br>見せ方が、すべてを決めている。',
        sub: 'スペックは問題ない。変えるべきは「<strong>外見が発しているシグナル</strong>」だ。着こなしが整うと、写真の雰囲気が変わり、マッチング率に直結する。'
      };
      if(t === 'matching_app' && s === 'mirror') return {
        h1: '<em>鏡の中の自分が、アプリの結果を作っている。</em>',
        sub: '毎朝感じているその違和感は、正しい危機感だ。朝の自分が変わると、写真が変わり、アプリの結果が変わる。<strong>スタートは今日、鏡の前から始まる。</strong>'
      };
      if(t === 'matching_app' && s === 'comparison') return {
        h1: '<em>あの人はなぜうまくいって、自分はうまくいかないのか。</em><br>差の正体がわかった。',
        sub: '比べるたびに諦めていたものの正体は「<strong>外見の積み重ねの差</strong>」だ。相手はある日突然変わったのではなく、何かを変えた。今日がその日になれる。'
      };
      if(t === 'matching_app') return {
        h1: '<em>頑張っているのに、変わらない。</em><br>その焦りには、根拠がある。',
        sub: '努力が結果に変わらない理由は「<strong>変えるべき場所を変えていない</strong>」からだ。今回の診断は、その場所を特定するためにある。'
      };

      // love × scene
      if(t === 'love' && s === 'first_impression') return {
        h1: '<em>好きな人がいる。でも、一歩が踏み出せない。</em><br>外見への自信が、距離を作っている。',
        sub: '恋愛で外見が果たす役割は「好意を生む」ことではなく、「<strong>自分が引き寄せた障壁を取り除く</strong>」ことだ。印象を下げている1点を変えるだけで、あの人との距離感が変わる。'
      };
      if(t === 'love' && s === 'photo') return {
        h1: '<em>好きな人がいる。でも、画面の中の自分が足を引っ張っている。</em>',
        sub: '気持ちは本物なのに、写真の自分が台無しにしている——その感覚は正しい。<strong>実物を整え、プロに撮ってもらう</strong>だけで、相手への印象は別物になる。'
      };
      if(t === 'love' && s === 'fashion') return {
        h1: '<em>好きな人の前で、自分が「なんかダサい」と思ってしまう。</em><br>その毎日の小さな敗北感を、終わらせよう。',
        sub: '着たいものが似合わない、何を着ればいいかわからない——それは才能の問題ではなく「<strong>軸を持っていない</strong>」問題だ。一度整理すれば、毎朝の選択が変わる。'
      };
      if(t === 'love' && s === 'mirror') return {
        h1: '<em>好きな人がいる。でも鏡の自分を見るたびに、気持ちが下がる。</em>',
        sub: 'その積み重ねが、一歩を踏み出せない原因になっている。好きな人への行動より先に、<strong>自分が自分を見て下がる理由</strong>を一つ取り除くことが鍵だ。'
      };
      if(t === 'love' && s === 'comparison') return {
        h1: '<em>好きな人の周りの「あいつ」と、自分を比べてしまう。</em><br>その差の正体を、今日分解する。',
        sub: '比べるたびに何かを諦めてきた。でもその差の多くは「<strong>積み重ねた習慣の差</strong>」だ。一点変えると、諦めの連鎖が断ち切られる。'
      };
      if(t === 'love') return {
        h1: '<em>好きな人がいる。外見への自信のなさが、<br>その人との距離を縮めることを邪魔している。</em>',
        sub: '動機は今が最大だ。<strong>この気持ちが薄れないうちに</strong>、最初の一点を変えることが大事。行動の先に自信があるのではなく、変えた先に自信が生まれる。'
      };

      // career × scene
      if(t === 'career' && s === 'first_impression') return {
        h1: '<em>大事な場面が控えている。<br>第一印象で後悔を持ち込みたくない。</em>',
        sub: '人生の節目に、外見への後悔は要らない。その場だけのための変化ではなく、<strong>その後も使い続ける外見の土台</strong>をここで作る。今がベストタイミングだ。'
      };
      if(t === 'career' && s === 'photo') return {
        h1: '<em>節目の写真が、この先ずっと残る。<br>今の自分を、ベストな状態で記録したい。</em>',
        sub: '写真は証拠として残る。整えた状態でプロに撮ってもらうことは、<strong>節目の準備として最も費用対効果が高い投資</strong>だ。'
      };
      if(t === 'career') return {
        h1: '<em>大事な場面が控えている。<br>外見への準備が、結果を左右する。</em>',
        sub: '節目は外見への意識が最も高まるタイミングだ。この機会を使って<strong>その後も通用する外見の土台</strong>を作ることができる。今動くことに意味がある。'
      };

      // word × scene
      if(t === 'word' && s === 'mirror') return {
        h1: '<em>言われた一言が、鏡を見るたびに蘇る。</em><br>その感覚が指している場所は、変えられる。',
        sub: '誰かの言葉と、鏡の中の自分が一致してしまった瞬間がある。それは傷ではなく「<strong>変わるための地図</strong>」だ。指している場所だけを変えればいい。全部変える必要はない。'
      };
      if(t === 'word' && s === 'comparison') return {
        h1: '<em>他人と比べてしまう。その差を、誰かに言語化された。</em><br>怒りか諦めか、どちらにするかはあなたが決める。',
        sub: 'ずっと気にしていたことが、外から言葉になった。それを諦めに変えるか、動力に変えるかが分岐点だ。<strong>その感覚は正しい。そして、変えられる。</strong>'
      };
      if(t === 'word') return {
        h1: '<em>誰かの一言が、ずっと引っかかっている。<br>その違和感は、変われるサインだ。</em>',
        sub: '「なんか違う」という感覚は裏切らない。その一言が指している部分を特定して、<strong>そこだけ変えればいい</strong>。全部変えなくていい。一点変えると連鎖が始まる。'
      };

      // vague × scene
      if(t === 'vague' && s === 'mirror') return {
        h1: '<em>特別なきっかけはない。でも、朝の鏡で<br>ずっと何かを諦めていた。</em>',
        sub: '毎朝少しずつ積み重なってきた「まあいっか」が、今動くきっかけになった。その諦めは習慣だ。<strong>一点変えると、習慣が崩れ始める。</strong>'
      };
      if(t === 'vague' && s === 'comparison') return {
        h1: '<em>特別な理由はない。でも、誰かと比べるたびに<br>何かを手放してきた気がする。</em>',
        sub: 'その「気がする」は正確だ。比べて諦める、という回路が定着している。<strong>その回路を断ち切る最初の行動</strong>が、今日ここにある。'
      };
      if(t === 'vague') return {
        h1: '<em>特別なきっかけはない。でも、ずっとどこかで<br>諦めていた。今がその諦めを手放すタイミングだ。</em>',
        sub: '「いつかやろう」が「今やる」に変わった瞬間をムダにしないことが大事。<strong>まず一点だけ変えると次が見えてくる。</strong>完璧に準備してから始めなくていい。'
      };

      // fallback
      return {
        h1: '<em>ずっと気になっていたことが、今動くきっかけになっている。</em>',
        sub: '「いつかやろう」が「今やる」に変わった瞬間をムダにしないことが大事。<strong>まず一点だけ変えると次が見えてくる。</strong>'
      };
    }

    // ────────────────────────────────────────────────────────────────
    // 2. 気になりタイプ判定
    // ────────────────────────────────────────────────────────────────
    function getConcernType(){
      const high = Object.entries(areas).filter(([,v])=>v>=3);
      const facial = ['eyebrow','skin','photo'].filter(k=>(areas[k]||0)>=3);
      const bodyStyle = ['body','fashion'].filter(k=>(areas[k]||0)>=3);
      const hasOverall = (areas.overall||0)>=2;
      const topArea = [...Object.entries(areas)].sort(([,a],[,b])=>b-a)[0];

      if(high.length===0 && Object.values(areas).every(v=>v<=1)) return {
        type:'メンテナンス型',
        desc:'大きな問題点はなく、細部の質を上げていく段階。一点一点の完成度を高めることで「なんかあの人いつも整ってる」という印象が定着する。',
        color:'#059669', bg:'#f0fdf4', border:'#a7f3d0'
      };
      if(hasOverall && high.length>=3) return {
        type:'全面リニューアル型',
        desc:'複数の部分がまんべんなく気になっている状態。どこから手をつければいいかわからなくなりやすい。まず外見コンサルで優先順位を整理することが最も効率的。',
        color:'#7c3aed', bg:'#f5f3ff', border:'#c4b5fd'
      };
      if(facial.length>=2) return {
        type:'第一印象・顔まわり集中型',
        desc:'眉毛・肌・写真映りなど顔まわりへの気になり度が高い。会ったとき・写真・鏡を見たときに強く感じるタイプ。顔まわりを一つ整えるだけで変化を感じやすく、コストパフォーマンスが最も高いゾーン。',
        color:'#2563eb', bg:'#eff6ff', border:'#bfdbfe'
      };
      if(bodyStyle.length>=2) return {
        type:'ボディ×スタイル型',
        desc:'体型と服・着こなしへの気になり度が高い。「なんかスタイルよく見える」という印象は体型と服の組み合わせで作られる。どちらか一方だけ変えても効果が出にくく、両方の方向を同時に考えることが重要。',
        color:'#d97706', bg:'#fffbeb', border:'#fde68a'
      };
      if((areas.hair||0)>=3 && facial.length>=1) return {
        type:'清潔感底上げ型',
        desc:'髪と顔まわりへの気になり度が高い。この2点が整うだけで「なんか清潔感ある」という印象になる。コストと時間のパフォーマンスが最も高い変化のゾーン。',
        color:'#0891b2', bg:'#ecfeff', border:'#a5f3fc'
      };
      if(topArea && topArea[1]>=3){
        const [id] = topArea;
        const typeMap = {
          hair:    { type:'髪型特化型', desc:'髪型への気になり度が突出している。ここを変えるだけで「あの人なんか雰囲気変わった？」という反応が来やすい。美容院1回で体感できる変化がある。', color:'#2563eb', bg:'#eff6ff', border:'#bfdbfe' },
          skin:    { type:'肌ケア特化型', desc:'肌への気になり度が高い。肌は近距離で一番見られる部分。清潔感の土台であり、ここを改善すると全体の印象が底上げされる。スキンケアとエステで確実に変えられる。', color:'#0891b2', bg:'#ecfeff', border:'#a5f3fc' },
          eyebrow: { type:'眉毛特化型', desc:'眉毛への気になり度が高い。眉は顔の印象を決める最重要パーツ。1回のサロンで、別人のような印象になる可能性がある。変化のコストパフォーマンスが最も高い部位。', color:'#2563eb', bg:'#eff6ff', border:'#bfdbfe' },
          body:    { type:'ボディメイク型', desc:'体型への気になり度が高い。ここが変わると服の見え方がすべて変わる。継続が鍵になるため、続けやすい入口のあるパーソナルトレーナーから始めることが重要。', color:'#d97706', bg:'#fffbeb', border:'#fde68a' },
          fashion: { type:'スタイリング型', desc:'服・着こなしへの気になり度が高い。体型ではなく「サイズ感と色の選び方」だけで印象は大きく変わる。一度パーソナルスタイリストに見てもらうと、自分に合う軸ができる。', color:'#7c3aed', bg:'#f5f3ff', border:'#c4b5fd' },
          photo:   { type:'写真映り特化型', desc:'写真映りへの気になり度が高い。マッチングアプリやSNSでの印象を変えたい状態。外見を整えたうえでプロに撮ってもらうことが最短解。', color:'#0891b2', bg:'#ecfeff', border:'#a5f3fc' },
          overall: { type:'全体印象型', desc:'全体的な雰囲気への気になり度が高い。パーツ単位で変えようとするより、外見コンサルで全体像を把握してから優先順位をつけて動く方が効率的。', color:'#7c3aed', bg:'#f5f3ff', border:'#c4b5fd' },
        };
        return typeMap[id] || { type:'変容準備型', desc:'気になる部分から一歩踏み出す段階。最初の一点を変えることで、変化のサイクルが始まる。', color:'#2563eb', bg:'#eff6ff', border:'#bfdbfe' };
      }
      return { type:'変容準備型', desc:'今の自分を変えていく段階にいる。まず一番気になっている部分から始めることで変化のサイクルが始まる。', color:'#2563eb', bg:'#eff6ff', border:'#bfdbfe' };
    }

    // ────────────────────────────────────────────────────────────────
    // 3. 壁の分析（failure_pattern）
    // ────────────────────────────────────────────────────────────────
    function getBarrierAnalysis(){
      const f = p.failure_pattern;
      if(!f) return null;
      const map = {
        lost_direction: { text:'「何をすればいいかわからない」状態で止まる傾向がある。', sub:'これは意志の問題ではなく、プログラムの設計の問題。週ごとの目標が明確で次のステップが常に見えているプロと組むことで、この壁は乗り越えられる。', condition:'明確な構造を持ち、ステップバイステップで進めてくれるプロ' },
        no_continuation: { text:'効果を感じながらも、続かなかった経験がある。', sub:'続かない理由の多くは「ハードルが高すぎる」か「一人でやろうとした」こと。月1〜2回でも継続できる環境と定期的に関わってくれるプロが解決策になる。', condition:'負担が小さく始められて継続サポートが得意なプロ' },
        cost: { text:'コストや時間の面で続けられなかった経験がある。', sub:'一気に全部やろうとするとコストで詰まる。まず1点だけ変える。変化が実感できたら次に進む。この順序が鍵。', condition:'小さく始められる体験メニューがある、または単価が明確なプロ' },
        awkward: { text:'プロとの関係性でつまずいた経験がある。', sub:'押し付け感・空気感・やり取りの違和感がストレスになって離れるパターンは多い。「相性」を最初から重視できるプロを選ぶことが今回の最優先事項。', condition:'押し売りせず、こちらのペースを尊重してくれるプロ' },
        no_result: { text:'変化が感じられずに諦めた経験がある。', sub:'変化が見えない理由は「合っていないサービスを選んでいた」か「評価方法を知らなかった」かのどちらかが多い。今回の診断で合うカテゴリを先に絞ることで、これを回避する。', condition:'before/afterが明確で変化を可視化してくれるプロ' },
        ongoing: { text:'今も継続中。さらに深化させる段階にいる。', sub:'基礎は出来ている。次はバラバラに磨いてきたパーツを全体として活かす「統合」の段階。外見コンサルや写真・出会いの場への活用が次のステップ。', condition:'総合的な外見プロデュースができるプロ' },
      };
      return map[f] || null;
    }

    // ────────────────────────────────────────────────────────────────
    // 4. 優先取り組み
    // ────────────────────────────────────────────────────────────────
    function getPriorityAction(){
      const sorted = Object.entries(areas).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a);
      if(sorted.length===0) return null;
      const [topId, topLevel] = sorted[0];
      const ICONS = { hair:'💇‍♂️', skin:'✨', eyebrow:'✂️', body:'💪', fashion:'👔', photo:'📸', overall:'🧑‍⚕️' };
      const NAMES = { hair:'髪型・髪', skin:'肌・ニキビ', eyebrow:'眉毛', body:'体型・体', fashion:'服・コーデ', photo:'写真写り', overall:'外見コンサル' };
      const COPY = {
        hair:'髪型は第一印象の30%を占める。ここを変えると「なんかいい感じ」に見える。美容院1回で体感できる変化がある。',
        skin:'肌は近距離で一番差が出る。清潔感の土台であり、ここを整えると全体の印象が底上げされる。',
        eyebrow:'眉毛は顔の印象を一番早く変えられる。1回のサロンで、別人のような第一印象になる可能性がある。',
        body:'体型が変わると服の見え方がすべて変わる。継続が鍵なので、続けやすい入口から始めることが重要。',
        fashion:'サイズ感と色を整えるだけで印象は別物になる。体型より「選び方」で変えられる部分。',
        photo:'写真映りの問題は実物がどれだけ良くても解決しない。プロに撮ってもらうことがマッチング結果を変える最短解。',
        overall:'パーツ単位で見ても改善しにくい状態。外見コンサルで全体像を把握してから動くのが最も効率的。',
      };
      const CATS = { hair:'hair', skin:'esthetic', eyebrow:'eyebrow', body:'gym', fashion:'fashion', photo:'photo', overall:'consulting' };
      const urgencyNote = p.urgency==='high' ? ' 締め切りがある今、ここが最短ルート。' : '';
      return {
        icon: ICONS[topId]||'🎯', name: NAMES[topId]||topId,
        copy: (COPY[topId]||'') + urgencyNote,
        cat: CATS[topId]||'consulting', level: topLevel
      };
    }

    // ────────────────────────────────────────────────────────────────
    // 5. 合うプロの特徴
    // ────────────────────────────────────────────────────────────────
    function getProviderTraits(){
      const traits = [];
      const styleMap = { explanation:'「なぜそうするのか」を丁寧に説明してくれる', consultation:'こちらの意見を聞きながら一緒に進めてくれる', delegate:'任せたら確実に結果を出してくれる', cautious:'小さく始められる体験メニューがある' };
      const relMap = { continuity:'毎回前回の続きから始めてくれる（記録してくれる）', directive:'やることをはっきり指示してくれる', accessibility:'予約以外でも気軽に相談できる（LINE等）', autonomy:'押し売りせず、こちらのペースを尊重する' };
      const failMap = { lost_direction:'プログラムが明確で週ごとの目標がある', no_continuation:'無理なく続けられるペースを提案してくれる', awkward:'空気感がよく、話しやすい', no_result:'before/afterが明確で変化を可視化してくれる' };
      if(p.style && styleMap[p.style]) traits.push(styleMap[p.style]);
      if(p.relationship && relMap[p.relationship]) traits.push(relMap[p.relationship]);
      if(p.failure_pattern && failMap[p.failure_pattern]) traits.push(failMap[p.failure_pattern]);
      return [...new Set(traits)].slice(0,4);
    }

    // ────────────────────────────────────────────────────────────────
    // 6. おすすめカテゴリ
    // ────────────────────────────────────────────────────────────────
    function getRecommendations(){
      const MAP = {
        hair:    { icon:'💇‍♂️', label:'ヘア・美容院', reason:'第一印象に直結する', cat:'hair' },
        skin:    { icon:'💆‍♂️', label:'肌・エステ', reason:'清潔感の土台', cat:'esthetic' },
        eyebrow: { icon:'✂️', label:'眉毛サロン', reason:'顔印象を最速で変える', cat:'eyebrow' },
        body:    { icon:'🏋️‍♂️', label:'パーソナルジム', reason:'体型が服の見え方を変える', cat:'gym' },
        fashion: { icon:'👔', label:'ファッション', reason:'サイズ感と色で別人になれる', cat:'fashion' },
        photo:   { icon:'📸', label:'プロフィール写真', reason:'アプリ結果を直接変える', cat:'photo' },
        overall: { icon:'🧑‍⚕️', label:'外見トータルサポート', reason:'優先順位を整理できる', cat:'consulting' }
      };
      return Object.entries(areas).filter(([,v])=>v>0).sort(([,a],[,b])=>b-a).slice(0,3).map(([id])=>MAP[id]).filter(Boolean);
    }

    // ────────────────────────────────────────────────────────────────
    // 7. バーカラー
    // ────────────────────────────────────────────────────────────────
    function levelColor(l){
      return ['#e5e7eb','#93c5fd','#60a5fa','#3b82f6','#1d4ed8'][l]||'#e5e7eb';
    }

    // ────────────────────────────────────────────────────────────────
    // HTML生成
    // ────────────────────────────────────────────────────────────────
    const situation   = getCoreSituation();
    const barrier     = getBarrierAnalysis();
    const priority    = getPriorityAction();
    const traits      = getProviderTraits();
    const recs        = getRecommendations();
    const concernType = getConcernType();
    const concernSorted = Object.entries(areas).sort(([,a],[,b])=>b-a);
    const hasAnyConcern = concernSorted.some(([,v])=>v>0);

    const html = `
      <!-- ── Hero ── -->
      <div class="result-hero">
        <div class="result-badge">診断完了</div>
        <h1>${situation.h1}</h1>
        <div class="result-hero-divider"></div>
        <p class="result-hero-sub">${situation.sub}</p>
      </div>

      <!-- ── 今すぐ取り組むべき1点 ── -->
      ${priority ? `
      <p class="section-label">Priority Action</p>
      <div class="priority-card">
        <div class="priority-card-eyebrow">今すぐ取り組むべき1点</div>
        <div class="priority-card-main">${priority.icon} ${priority.name}</div>
        <div class="priority-card-reason">${priority.copy}</div>
        <a href="./search.html?category=${priority.cat}&diag=1" class="priority-card-cta">このカテゴリのサービスを見る</a>
      </div>` : ''}

      <!-- ── 外見タイプ分析 ── -->
      <p class="section-label" style="margin-top:28px">Type Analysis</p>
      <div class="result-card">
        <div class="result-card-header">
          <div class="result-card-title">🔬 あなたの外見タイプ分析</div>
          <div class="result-card-subtitle">気になり度のパターンから、最も効率よく変わる道筋が見える</div>
        </div>
        <div class="type-badge-wrap">
          <div class="type-badge" style="background:${concernType.color}">${concernType.type}</div>
          <div class="type-desc-box" style="background:${concernType.bg};border:1.5px solid ${concernType.border}">
            ${concernType.desc}
          </div>
        </div>
        ${hasAnyConcern ? `
        <div class="concern-bars">
          ${concernSorted.map(([id,level])=>`
            <div class="concern-bar-row">
              <div class="concern-bar-label">${CONCERN_ICONS[id]||''} ${CONCERN_NAMES[id]||id}</div>
              <div class="concern-bar-track">
                <div class="concern-bar-fill" style="width:${Math.round((level/4)*100)}%;background:${levelColor(level)}"></div>
              </div>
              <div class="concern-bar-value" style="color:${levelColor(level)}">${LEVEL_TEXT[level]||''}</div>
            </div>
          `).join('')}
        </div>` : ''}
      </div>

      <!-- ── 変われなかった理由と条件 ── -->
      ${barrier ? `
      <p class="section-label" style="margin-top:28px">Root Cause</p>
      <div class="result-card">
        <div class="result-card-header">
          <div class="result-card-title">🔍 変われなかった理由と、変わるための条件</div>
          <div class="result-card-subtitle">過去のパターンを知ることが、次に勝つための準備になる</div>
        </div>
        <div class="insight-list">
          <div class="insight-item">
            <div class="insight-label">過去のパターン</div>
            <div class="insight-text">${barrier.text}</div>
            <div class="insight-sub">${barrier.sub}</div>
          </div>
          ${barrier.condition ? `
          <div class="insight-item" style="border-left-color:#059669;background:#f0fdf4">
            <div class="insight-label" style="color:#059669">今回優先するプロの条件</div>
            <div class="insight-text">${barrier.condition}</div>
          </div>` : ''}
        </div>
      </div>` : ''}

      <!-- ── 合うプロの特徴 ── -->
      ${traits.length > 0 ? `
      <p class="section-label" style="margin-top:28px">Pro Matching</p>
      <div class="result-card">
        <div class="result-card-header">
          <div class="result-card-title">🤝 あなたに合うプロの特徴</div>
          <div class="result-card-subtitle">この条件を持つプロとの相性がいい。サービス選びの判断軸にしてほしい</div>
        </div>
        <div class="trait-list">
          ${traits.map(t=>`<div class="trait-item"><div class="trait-check">✓</div><span>${t}</span></div>`).join('')}
        </div>
        <p style="font-size:12px;color:#9ca3af;margin:14px 0 0;padding-left:2px">掲載者ページでこの条件との一致度を確認できます。</p>
      </div>` : ''}

      <!-- ── おすすめカテゴリ ── -->
      ${recs.length > 0 ? `
      <p class="section-label" style="margin-top:28px">Recommendations</p>
      <div class="result-card">
        <div class="result-card-header">
          <div class="result-card-title">🎯 気になり度の高い順カテゴリ</div>
          <div class="result-card-subtitle">最上位のカテゴリから手をつけるのが最短ルート</div>
        </div>
        ${recs.map((r,i)=>`
          <a href="./search.html?category=${r.cat}&diag=1" class="recommend-card${i===0?' top':''}">
            <span class="recommend-card-icon">${r.icon}</span>
            <span class="recommend-card-body">
              <span class="recommend-card-title">${r.label}</span>
              <span class="recommend-card-reason" style="display:block">${r.reason}</span>
            </span>
            ${i===0?'<span class="recommend-card-badge">最優先</span>':''}
          </a>
        `).join('')}
      </div>` : ''}

      <!-- ── 診断深掘りプレビュー（stage2未完了時） ── -->
      ${!p.stage2_completed ? `
      <p class="section-label" style="margin-top:28px">Go Deeper</p>
      <div class="deepdive-section">
        <div class="deepdive-title">続きを答えると、ここまでわかる</div>
        <div class="deepdive-desc">あと数問答えるだけで、診断の精度が大幅に上がる。今の結果は「入口」に過ぎない。</div>
        <div class="deepdive-items">
          <div class="deepdive-item">
            <div class="deepdive-item-icon">📖</div>
            <div class="deepdive-item-body">
              <div class="deepdive-item-if">過去に試みたことを教えると</div>
              <div class="deepdive-item-then">あなたが変われなかった本当の理由がわかる</div>
            </div>
            <div class="deepdive-arrow">→</div>
          </div>
          <div class="deepdive-item">
            <div class="deepdive-item-icon">🤝</div>
            <div class="deepdive-item-body">
              <div class="deepdive-item-if">理想のプロとの関係性を教えると</div>
              <div class="deepdive-item-then">相性の良いプロが絞り込まれる</div>
            </div>
            <div class="deepdive-arrow">→</div>
          </div>
        </div>
        <a href="./diagnosis.html" class="btn" style="display:inline-block;font-size:14px;font-weight:700">続きを答える（あと4問）→</a>
      </div>` : ''}

      <!-- ── 次のステップ CTA ── -->
      <div class="cta-block" style="margin-top:28px">
        <div class="cta-block-title">次のステップへ</div>
        <div class="cta-block-desc">診断結果を活かして、最初の一歩を踏み出そう。</div>
        <div class="cta-section">
          <a href="./search.html?diag=1" class="cta-btn-primary">あなたに合うサービスを探す</a>
          <button id="btn-save-mypage" class="cta-btn-secondary" type="button">診断結果を保存する</button>
          <div class="cta-divider"></div>
          <a href="./diagnosis.html" class="cta-btn-ghost">もう一度診断する</a>
        </div>
      </div>
    `;

    root.innerHTML = html;

    // 保存ボタン
    const saveBtn = document.getElementById('btn-save-mypage');
    if(saveBtn){
      saveBtn.addEventListener('click',()=>{
        try{
          const snap = { savedAt: new Date().toISOString(), profile: p };
          const key = 'fineme:saved:diagnoses';
          const arr = JSON.parse(localStorage.getItem(key)||'[]');
          arr.unshift(snap);
          if(arr.length>20) arr.length=20;
          localStorage.setItem(key, JSON.stringify(arr));
          saveBtn.textContent = '保存しました ✓';
          saveBtn.style.opacity = '.6';
          saveBtn.style.pointerEvents = 'none';
        }catch(e){}
      });
    }
  })();
  </script>
</body>
