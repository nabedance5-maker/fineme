<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理 — Fineme</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #0a0f1e; color: #e8e4dc; min-height: 100vh; padding: 16px; }
  h1 { font-size: 20px; font-weight: 800; color: #c9a84c; margin-bottom: 2px; }
  .date { font-size: 12px; color: rgba(232,228,220,0.45); margin-bottom: 20px; }

  /* 追加フォーム */
  .add-form { display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
  .add-input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #e8e4dc; font-size: 15px; padding: 11px 14px; width: 100%; font-family: inherit; }
  .add-input::placeholder { color: rgba(232,228,220,0.35); }
  .add-input:focus { outline: none; border-color: rgba(201,168,76,0.5); }
  .add-row { display: flex; gap: 8px; }
  .cat-select { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #e8e4dc; font-size: 13px; padding: 9px 12px; font-family: inherit; flex: 1; }
  .cat-select:focus { outline: none; border-color: rgba(201,168,76,0.5); }
  .add-btn { background: linear-gradient(135deg,#c9a84c,#e8c97a); color: #0a0f1e; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; padding: 9px 20px; cursor: pointer; white-space: nowrap; }
  .add-btn:active { opacity: 0.85; }

  /* カテゴリタブ */
  .cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .cat-tab { padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: rgba(232,228,220,0.55); cursor: pointer; transition: all .15s; }
  .cat-tab.active { background: rgba(201,168,76,0.15); border-color: rgba(201,168,76,0.4); color: #c9a84c; }

  /* タスクリスト */
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 13px 14px; transition: opacity .2s; }
  .task-item.done { opacity: 0.45; }
  .task-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(232,228,220,0.25); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
  .task-check.checked { background: #10b981; border-color: #10b981; }
  .task-check.checked::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 900; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 14px; color: rgba(232,228,220,0.90); line-height: 1.5; word-break: break-word; }
  .task-item.done .task-title { text-decoration: line-through; color: rgba(232,228,220,0.35); }
  .task-cat-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-top: 3px; }
  .task-del { background: transparent; border: none; color: rgba(232,228,220,0.2); font-size: 18px; cursor: pointer; padding: 4px 6px; flex-shrink: 0; line-height: 1; border-radius: 6px; }
  .task-del:hover { color: rgba(239,68,68,0.7); background: rgba(239,68,68,0.08); }

  /* セクションヘッダー */
  .section-header { font-size: 11px; font-weight: 700; color: rgba(232,228,220,0.35); text-transform: uppercase; letter-spacing: .1em; padding: 12px 0 6px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 4px; }
  .section-header:first-child { border-top: none; margin-top: 0; }

  /* 完了済みクリア */
  .clear-done-btn { width: 100%; margin-top: 16px; padding: 10px; background: transparent; border: 1px dashed rgba(239,68,68,0.25); border-radius: 8px; color: rgba(239,68,68,0.5); font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .clear-done-btn:hover { background: rgba(239,68,68,0.05); border-color: rgba(239,68,68,0.4); color: rgba(239,68,68,0.8); }

  /* ローディング */
  .loading { text-align: center; color: rgba(232,228,220,0.35); font-size: 13px; padding: 32px; }
  .empty { text-align: center; color: rgba(232,228,220,0.3); font-size: 13px; padding: 24px; }

  /* カテゴリ色 */
  .badge-開発レビュー { background: rgba(99,102,241,0.15); color: #818cf8; }
  .badge-発信・SNS    { background: rgba(236,72,153,0.12); color: #f472b6; }
  .badge-営業・DM     { background: rgba(245,158,11,0.12); color: #fbbf24; }
  .badge-確認・数値   { background: rgba(16,185,129,0.12); color: #34d399; }
  .badge-その他       { background: rgba(255,255,255,0.06); color: rgba(232,228,220,0.5); }

  @media (min-width: 480px) {
    body { padding: 24px; max-width: 560px; margin: 0 auto; }
  }
</style>
</head>
<body>

<h1>📋 タスク管理</h1>
<div class="date" id="today-date"></div>

<div class="add-form">
  <input class="add-input" id="add-input" type="text" placeholder="タスクを追加..." autocomplete="off">
  <div class="add-row">
    <select class="cat-select" id="add-cat">
      <option value="開発レビュー">🔧 開発レビュー</option>
      <option value="発信・SNS">📣 発信・SNS</option>
      <option value="営業・DM">📤 営業・DM</option>
      <option value="確認・数値">📊 確認・数値</option>
      <option value="その他" selected>💡 その他</option>
    </select>
    <button class="add-btn" id="add-btn">追加</button>
  </div>
</div>

<div class="cat-tabs" id="cat-tabs">
  <button class="cat-tab active" data-cat="">すべて</button>
  <button class="cat-tab" data-cat="開発レビュー">🔧 開発</button>
  <button class="cat-tab" data-cat="発信・SNS">📣 発信</button>
  <button class="cat-tab" data-cat="営業・DM">📤 営業</button>
  <button class="cat-tab" data-cat="確認・数値">📊 確認</button>
  <button class="cat-tab" data-cat="その他">💡 その他</button>
</div>

<div id="task-list" class="task-list"><div class="loading">読み込み中...</div></div>
<button class="clear-done-btn" id="clear-done-btn" style="display:none">完了済みをすべて削除</button>

<script>
const API = '/api/admin/tasks';
const KEY_STORAGE = 'fineme:business:key'; // 運営管理画面のadminキーとは別キー

let ADMIN_KEY = localStorage.getItem(KEY_STORAGE) || '';
if (!ADMIN_KEY) {
  ADMIN_KEY = prompt('業務アクセスキーを入力してください：') || '';
  if (ADMIN_KEY) {
    // 認証確認
    fetch('/api/business/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: ADMIN_KEY }),
    }).then(r => {
      if (r.ok) {
        localStorage.setItem(KEY_STORAGE, ADMIN_KEY);
      } else {
        alert('キーが正しくありません');
        ADMIN_KEY = '';
      }
    });
  }
}

let tasks = [];
let activeFilter = '';

// 今日の日付
document.getElementById('today-date').textContent =
  new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

const headers = { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY };

async function fetchTasks() {
  try {
    const res = await fetch(API, { headers });
    if (!res.ok) { document.getElementById('task-list').innerHTML = '<div class="loading">APIキーが違うか、SQLが未適用です</div>'; return; }
    tasks = await res.json();
    render();
  } catch { document.getElementById('task-list').innerHTML = '<div class="loading">通信エラー</div>'; }
}

function catBadge(cat) {
  return `<span class="task-cat-badge badge-${cat}">${cat}</span>`;
}

function render() {
  const list = document.getElementById('task-list');
  const clearBtn = document.getElementById('clear-done-btn');
  let filtered = activeFilter ? tasks.filter(t => t.category === activeFilter) : tasks;
  const todo = filtered.filter(t => !t.done);
  const done = filtered.filter(t => t.done);

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">タスクがありません</div>';
    clearBtn.style.display = 'none';
    return;
  }

  let html = '';
  if (todo.length) {
    html += `<div class="section-header">未完了 ${todo.length}件</div>`;
    todo.forEach(t => { html += taskHtml(t); });
  }
  if (done.length) {
    html += `<div class="section-header">完了済み ${done.length}件</div>`;
    done.forEach(t => { html += taskHtml(t); });
  }
  list.innerHTML = html;
  clearBtn.style.display = done.length ? 'block' : 'none';

  list.querySelectorAll('.task-check').forEach(el => {
    el.addEventListener('click', () => toggleDone(el.dataset.id, el.classList.contains('checked')));
  });
  list.querySelectorAll('.task-del').forEach(el => {
    el.addEventListener('click', () => deleteTask(el.dataset.id));
  });
}

function taskHtml(t) {
  return `<div class="task-item${t.done ? ' done' : ''}">
    <div class="task-check${t.done ? ' checked' : ''}" data-id="${t.id}"></div>
    <div class="task-body">
      <div class="task-title">${escHtml(t.title)}</div>
      ${catBadge(t.category)}
    </div>
    <button class="task-del" data-id="${t.id}" title="削除">×</button>
  </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function toggleDone(id, currentlyDone) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  task.done = !currentlyDone;
  render();
  await fetch(`${API}/${id}`, { method: 'PATCH', headers, body: JSON.stringify({ done: !currentlyDone }) });
}

async function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  render();
  await fetch(`${API}/${id}`, { method: 'DELETE', headers });
}

async function addTask() {
  const input = document.getElementById('add-input');
  const title = input.value.trim();
  if (!title) return;
  const category = document.getElementById('add-cat').value;
  input.value = '';
  const res = await fetch(API, { method: 'POST', headers, body: JSON.stringify({ title, category }) });
  if (res.ok) { const t = await res.json(); tasks.unshift(t); render(); }
}

document.getElementById('add-btn').addEventListener('click', addTask);
document.getElementById('add-input').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

document.getElementById('cat-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.cat-tab');
  if (!tab) return;
  activeFilter = tab.dataset.cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t === tab));
  render();
});

document.getElementById('clear-done-btn').addEventListener('click', async () => {
  if (!confirm('完了済みタスクをすべて削除しますか？')) return;
  const done = tasks.filter(t => t.done && (!activeFilter || t.category === activeFilter));
  tasks = tasks.filter(t => !done.find(d => d.id === t.id));
  render();
  await Promise.all(done.map(t => fetch(`${API}/${t.id}`, { method: 'DELETE', headers })));
});

fetchTasks();
</script>
</body>
</html>
