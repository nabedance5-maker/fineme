<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>あなたのタイプ診断結果 | Fineme</title>
  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/components.css">
  <style>
    .diag-container{max-width:900px;margin:36px auto;padding:20px}
    .diag-card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.06)}
    .muted{color:#6b7280}
    .result-article{background:linear-gradient(180deg,#ffffff 0%,#fbfcfe 100%);padding:22px;border-radius:14px;border:1px solid rgba(2,6,23,0.04);box-shadow:0 18px 60px rgba(2,6,23,0.06);transition:transform .36s ease}
    .result-article:hover{transform:translateY(-4px)}
    .result-header{display:flex;align-items:center;gap:8px}
    .badge-emoji{display:inline-block;width:44px;height:44px;border-radius:999px;background:linear-gradient(135deg,#fff 0%,#fffbeb 100%);box-shadow:0 6px 18px rgba(2,6,23,0.08);display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:10px}
    .result-actions{display:flex;gap:8px;margin-top:12px}
    .btn{display:inline-block;padding:8px 12px;border-radius:8px;background:#111;color:#fff;text-decoration:none}
    .btn-ghost{background:transparent;border:1px solid rgba(0,0,0,0.06);color:#111}
  </style>
  </head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="diag-container">
      <div class="diag-card">
        <h1>あなたのタイプが決まりました</h1>
        <p class="muted">3つの問いへの回答をもとに、あなたの「変容タイプ」を導き出しました。これは評価ではなく、あなたの変容の地図の最初の一枚です。</p>
        <div id="result-root"><div id="loading">結果を読み込み中…</div></div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../scripts/main.js" type="module"></script>
  <script>
  (function(){
    const STORAGE_KEY = 'fineme:diagnosis:latest';
    const INTENT_TYPES_URL = '../data/intent-types.json';
    const root = document.getElementById('result-root');
    const loading = document.getElementById('loading');

    const WHY_MAP = {
      r01:'自信を持ちたい',
      r02:'周りからの見られ方を変えたい',
      r03:'今の自分を少し好きになりたい',
      r04:'何をすれば良いか分からない',
      r05:'特別なきっかけがあった'
    };

    function renderNotFound(){
      const wrap = document.createElement('div');
      const msg = document.createElement('p'); msg.textContent = 'STEP1の結果が見つかりません。最初からやり直してください。';
      const a = document.createElement('a'); a.href = './index.html'; a.className = 'btn'; a.textContent = '診断をやり直す';
      wrap.appendChild(msg); wrap.appendChild(a);
      root.innerHTML = ''; root.appendChild(wrap);
    }

    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){ renderNotFound(); return; }
      const obj = JSON.parse(raw);
      const intentId = obj?.intent?.type_id || '';
      const intentName = obj?.intent?.type_name || '';
      const whyId = obj?.why?.reason_id || '';
      const howName = obj?.how?.style_name || '';

      fetch(INTENT_TYPES_URL).then(r=>r.json()).then(typesData=>{
        const entry = typesData[intentId] || { name:intentName||'未選択', catch:'', description:'', advice:'', image:'' };
        root.innerHTML = '';

        const article = document.createElement('article'); article.className='result-article'; article.style.lineHeight='1.7';

        // ヘッダー：STEP1結果
        const headerWrap = document.createElement('div'); headerWrap.className = 'result-header';
        const badge = document.createElement('div'); badge.className='badge-emoji'; badge.textContent='🔎'; headerWrap.appendChild(badge);
        const title = document.createElement('h2'); title.style.fontSize='22px'; title.style.margin='0'; title.textContent = `あなたは「${entry.name}」`;
        headerWrap.appendChild(title);
        article.appendChild(headerWrap);

        if(entry.catch){ const catchEl = document.createElement('p'); catchEl.style.margin='8px 0 12px 0'; catchEl.style.fontWeight='600'; catchEl.textContent = entry.catch; article.appendChild(catchEl); }
        if(entry.description){ const p = document.createElement('p'); p.textContent = entry.description; article.appendChild(p); }
        // 視点ブロック（STEP1の WHY/HOW をもとに）
        (function(){
          const wrap = document.createElement('div'); wrap.className='result-article'; wrap.style.marginTop='12px';
          const title = document.createElement('h3'); title.textContent='あなたに合う変わり方'; wrap.appendChild(title);
          const how = (obj?.how?.style_name || '').toString();
          const whyId = (obj?.why?.reason_id || '').toString();
          const listChoose = [];
          if(/寄り添|相談|伴走/.test(how)) listChoose.push('相談/チェックのある人・お店を選ぶ');
          if(/慎重|納得|説明/.test(how)) listChoose.push('事前説明や比較検討ができる相手を選ぶ');
          if(/最短|効率|短期/.test(how)) listChoose.push('短期プランや成果指標が明確な相手を選ぶ');
          if(/変化|更新/.test(how)) listChoose.push('小さく試して更新提案がある相手を選ぶ');
          if(/世界観|直感|雰囲気/.test(how)) listChoose.push('ポートフォリオの世界観が合う相手を選ぶ');
          if(!listChoose.length) listChoose.push('相性の良い進め方（説明/伴走/短期）を確認して選ぶ');
          const chooseH = document.createElement('h4'); chooseH.textContent='選び方'; wrap.appendChild(chooseH);
          const chooseUl = document.createElement('ul'); listChoose.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; chooseUl.appendChild(li); }); wrap.appendChild(chooseUl);
          const stratH = document.createElement('h4'); stratH.textContent='進め方'; wrap.appendChild(stratH);
          // 進め方候補（STEP1用）
          const candidates = [
            '即効性のある小さな変更を試す（写真や比較で検証）',
            '短いスプリントで試す（1〜2週間）',
            '時間をかけて習慣化する（ルール化/定期振り返り）',
            '定期チェックインを設ける（相談/確認）',
            '目的を明文化し評価指標を決める',
            '意思決定の透明性を確保し、比較検討する'
          ];
          function stratWeight(lab){
            const L = String(lab);
            let w = 0;
            if(/最短|効率|短期|即/.test(how)){
              if(/即効|小さな変更|写真|比較|スプリント/.test(L)) w += 3;
            }
            if(/寄り添|相談|伴走|慎重|納得/.test(how)){
              if(/習慣|ルール化|定期|振り返り|チェックイン/.test(L)) w += 3;
            }
            if(/説明|可視化|透明/.test(how)){
              if(/目的|評価指標|明文化|透明性|比較検討/.test(L)) w += 2;
            }
            if(whyId==='r05'){ // 特別なきっかけ
              if(/即効|スプリント/.test(L)) w += 2;
            }
            if(whyId==='r04'){ // 何をすれば良いか分からない
              if(/明文化|評価指標|チェックイン|透明性/.test(L)) w += 2;
            }
            return w;
          }
          const ranked = candidates.slice().sort((a,b)=> stratWeight(b) - stratWeight(a));
          const weights = ranked.map(x=> stratWeight(x));
          const spread = weights.length? (Math.max(...weights) - Math.min(...weights)) : 0;
          const showRanks = spread > 0.5 && (/最短|効率|短期|即|寄り添|相談|伴走|慎重|納得|説明|可視化|透明/.test(how) || whyId);
          const stratUl = document.createElement('ul'); ranked.slice(0,4).forEach((t,i)=>{ const li=document.createElement('li'); li.textContent=t; if(showRanks){ const b=document.createElement('span'); b.textContent=` 優先度 ${i+1}`; b.style.marginLeft='6px'; b.style.padding='2px 6px'; b.style.border='1px solid var(--color-border)'; b.style.borderRadius='999px'; b.style.fontSize='12px'; li.appendChild(b); } stratUl.appendChild(li); }); wrap.appendChild(stratUl);
          if(!showRanks){ const note=document.createElement('p'); note.className='muted'; note.textContent='※ STEP1の回答からは順位差が僅少のため、進め方の順位付けは行っていません（同程度）。'; wrap.appendChild(note); }
          const note = document.createElement('p'); note.className='muted'; note.textContent='※ あなたの「動機」と「スタイル」の回答をもとに生成しています。'; wrap.appendChild(note);
          article.appendChild(wrap);
        })();

        // あなたの選択（WHY/HOWの要約）
        const selh = document.createElement('h3'); selh.textContent='あなたが選んだ答え'; article.appendChild(selh);
        const ul = document.createElement('ul');
        const li1 = document.createElement('li'); li1.textContent = `動機（WHY）：${WHY_MAP[whyId] || '—'}`; ul.appendChild(li1);
        const li2 = document.createElement('li'); li2.textContent = `関わり方（HOW）：${howName || '—'}`; ul.appendChild(li2);
        article.appendChild(ul);

        const actions = document.createElement('div'); actions.className='result-actions';
        const goStep2 = document.createElement('a'); goStep2.href='./step2.html'; goStep2.className='btn'; goStep2.textContent='サービスを見つける（次へ）';
        const retry = document.createElement('a'); retry.href='./index.html'; retry.className='btn btn-ghost'; retry.textContent='もう一度診断する';
        actions.appendChild(goStep2); actions.appendChild(retry);
        article.appendChild(actions);

        root.appendChild(article);
      }).catch(()=>{ loading.textContent='タイプデータの読み込みに失敗しました'; });
    }catch(e){ renderNotFound(); }
  })();
  </script>
</body>
</html>
