<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>あなたの変容タイプ | Fineme</title>
  <link rel="stylesheet" href="../assets/styles/style.css">
  <link rel="stylesheet" href="../assets/styles/components.css">
  <style>
    /* ── Layout ── */
    .result-wrap{max-width:640px;margin:0 auto;padding:24px 20px 80px}
    .muted{color:#6b7280}

    /* ── Hero ── */
    .result-hero{text-align:center;padding:24px 0 16px}
    .result-type-badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0b2640,#0e3760);color:#fff;padding:10px 22px;border-radius:100px;font-weight:800;font-size:15px;margin-bottom:12px}
    .result-type-badge .type-letter{font-size:22px;font-weight:900}
    .result-hero h1{font-size:clamp(20px,4.5vw,28px);font-weight:800;color:#0b2640;margin:0 0 8px;line-height:1.3}
    .result-hero .hero-sub{font-size:15px;color:#6b7280;margin:0;line-height:1.6}

    /* ── Story card ── */
    .story-card{background:linear-gradient(135deg,#0f0f0f 0%,#1a1a2e 100%);color:#fff;padding:20px 24px;border-radius:14px;margin:12px 0 16px;line-height:1.9}
    .story-card p{margin:0;font-size:15px}

    /* ── Profile card ── */
    .result-profile-card{background:linear-gradient(135deg,rgba(11,38,64,.05),rgba(185,143,59,.04));border:1.5px solid rgba(11,38,64,.14);border-radius:14px;padding:16px 18px;margin-bottom:16px}
    .result-profile-title{font-size:11px;font-weight:700;color:#b98f3b;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
    .result-profile-rows{display:flex;flex-direction:column;gap:8px}
    .result-profile-row{display:flex;align-items:flex-start;gap:10px;font-size:14px}
    .result-profile-row .rp-key{flex-shrink:0;width:110px;color:#6b7280;font-size:12px;padding-top:1px}
    .result-profile-row .rp-val{font-weight:600;color:#0b2640;line-height:1.4}

    /* ── Section ── */
    .result-section{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;border:1px solid #e5e7eb;box-shadow:0 2px 8px rgba(2,6,23,.04)}
    .result-section-label{font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px}

    /* ── Gap analysis ── */
    .gap-list{display:flex;flex-direction:column;gap:10px}
    .gap-item{display:flex;align-items:center;gap:12px}
    .gap-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
    .gap-label{flex:1;font-size:14px;font-weight:600;color:#0b2640}
    .gap-priority{font-size:11px;color:#b98f3b;font-weight:700}
    .gap-status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
    .gap-status.is-gap{background:#fef2f2;color:#b91c1c}
    .gap-status.is-ok{background:#f0fdf4;color:#059669}

    /* ── Priority cards ── */
    .priority-card{background:linear-gradient(135deg,rgba(11,38,64,.04),rgba(185,143,59,.04));border:2px solid #0b2640;border-radius:12px;padding:16px}
    .priority-card+.priority-card{margin-top:10px;border-color:#e5e7eb;background:#fff}
    .priority-rank{font-size:11px;font-weight:700;color:#b98f3b;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
    .priority-title{font-size:17px;font-weight:800;color:#0b2640;margin-bottom:4px}
    .priority-reason{font-size:13px;color:#6b7280;line-height:1.5}

    /* ── Quick win ── */
    .quick-win-card{background:linear-gradient(135deg,#fefce8,#fffbeb);border:2px solid #b98f3b;border-radius:12px;padding:16px;margin-bottom:16px}
    .quick-win-label{font-size:11px;font-weight:700;color:#b98f3b;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
    .quick-win-title{font-size:15px;font-weight:700;color:#92400e}
    .quick-win-text{font-size:13px;color:#78350f;margin-top:4px;line-height:1.55}

    /* ── First step ── */
    .first-step-card{background:linear-gradient(135deg,#0b2640,#0e3760);border-radius:14px;padding:20px;margin-bottom:16px}
    .first-step-label{font-size:11px;font-weight:700;color:#b98f3b;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
    .first-step-text{font-size:15px;font-weight:700;color:#fff;line-height:1.6}

    /* ── HOW CTA ── */
    .how-cta-card{background:linear-gradient(135deg,#f0fdf4,#f7fee7);border:2px solid #16a34a;border-radius:12px;padding:16px;margin-bottom:10px}
    .how-cta-label{font-size:11px;font-weight:700;color:#15803d;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
    .how-cta-title{font-size:15px;font-weight:800;color:#14532d;margin-bottom:4px}
    .how-cta-note{font-size:13px;color:#166534;line-height:1.55;margin-bottom:12px}
    .how-cta-link{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:linear-gradient(90deg,#15803d,#16a34a);color:#fff!important;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;transition:transform .15s,box-shadow .15s}
    .how-cta-link:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(21,128,61,.3)}

    /* ── Next step links ── */
    .next-step-link{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(90deg,#0b2640,#0e3760);color:#fff!important;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px;margin-bottom:8px;transition:transform .18s,box-shadow .18s}
    .next-step-link:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,38,64,.2)}
    .next-step-link .step-icon{font-size:20px}
    .next-step-link .step-text{flex:1}
    .next-step-link .step-arrow{font-size:16px;opacity:.7}

    /* ── Block ── */
    .block{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:12px}
    .block-title{font-weight:700;margin-bottom:8px}

    /* ── Chips ── */
    .highlights{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
    .chip{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:4px 10px;font-size:12px}

    /* ── Slider ── */
    .result-slider{position:relative;margin-top:8px;margin-bottom:16px}
    .slider-controls{position:absolute;right:8px;top:-32px;display:flex;gap:8px}
    .slider-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
    .slider-track::-webkit-scrollbar{height:8px}
    .slider-track::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:8px}
    .slide-card{flex:0 0 auto;width:200px;scroll-snap-align:start;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 4px 12px rgba(2,6,23,.06);text-decoration:none;color:#111827}
    .slide-card:hover{transform:translateY(-2px);transition:all .2s ease}
    .slide-emoji{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;background:linear-gradient(135deg,#fff 0%,#fef3c7 100%);box-shadow:0 6px 18px rgba(2,6,23,.08);font-size:20px;margin:10px}
    .slide-label{padding:10px;font-weight:600}

    /* ── Buttons ── */
    .btn{display:inline-block;padding:10px 16px;border-radius:8px;background:#111;color:#fff!important;text-decoration:none;font-weight:700;font-size:14px;cursor:pointer;border:none}
    .btn-ghost{background:transparent!important;border:1px solid rgba(0,0,0,.1);color:#111!important}
    .result-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .retry-btn{width:100%;padding:14px;background:none;border:2px solid #e5e7eb;border-radius:12px;color:#6b7280;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
    .retry-btn:hover{border-color:#0b2640;color:#0b2640}

    /* ── Waitlist ── */
    .waitlist-section{text-align:center;padding:24px 20px;background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid rgba(11,38,64,.1);border-radius:14px;margin-bottom:16px}
    .waitlist-section h3{font-size:16px;font-weight:700;color:#0b2640;margin:0 0 8px}
    .waitlist-section p{font-size:13px;color:#6b7280;margin:0 0 16px}
    .waitlist-section .wl-btn{display:inline-block;padding:12px 28px;background:linear-gradient(90deg,#0b2640,#0e3760);color:#fff!important;border-radius:12px;font-weight:700;text-decoration:none;font-size:15px}

    /* ── Toast ── */
    .toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:8px 12px;border-radius:8px;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;z-index:9999}
    .toast.show{opacity:1;transform:translateY(0)}

    @keyframes floatUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
    @media(max-width:520px){.result-profile-row .rp-key{width:90px}}
  </style>
</head>
<body>
  <header id="site-header"></header>

  <script src="../scripts/main.js" type="module"></script>
  <script>
  (function(){

    /* ===== TYPE6_COPY ===== */
    const TYPE6_COPY = {
      t01:{name:'納得してから動く人',state:'「変わりたい」という気持ちは本物です。ただ、理由なく動くのが性に合わないだけ。それは弱さではなく、自分の選択に責任を持てる人間である証拠です。根拠が揃った瞬間に、あなたは誰より深く変わっていける。',strength:'表面的な変化では満足しない。理由と根拠を持って変わるから、ブレない。',fit:['なぜそうなるかを説明してくれる関わり方','試してから調整できる進め方','押し売りせず、質問に丁寧に答えてくれる人'],empathy:'根拠が揃ったとき、あなたは誰より確実に動ける人です。',logic:'説明が丁寧で、プロセスを言語化できる店舗と相性が良いと判断しています。'},
      t02:{name:'伴走してもらいながら変わる人',state:'一人で全部決めなくていい。相談しながら、確認しながら進んでいける環境があれば、あなたは必ず変われます。「わからない」が弱さではなく、素直に聞ける力があることが最大の武器です。',strength:'人の話を素直に聞ける。相談しながら決められる。それが継続力の源になる。',fit:['一緒に考えてくれる関わり方','手順を一つずつ示してくれる進め方','こまめな確認と安心を提供してくれる人'],empathy:'寄り添いと安心感がある環境で、あなたは最大限に変われる人です。',logic:'無理をさせない進め方で、相談しながら決められる店舗を優先して表示しています。'},
      t03:{name:'結果が見えたら動ける人',state:'遠回りや待ちが苦手なのではなく、ゴールが明確でないと信じられないだけ。見通しが立った瞬間に、誰より速く、誰より深く動けます。今必要なのは、最初の「これだ」という確信です。',strength:'要点を掴むのが速い。動き出したら止まらない。結果にコミットできる。',fit:['実績と結果が明確な提案','短い試行と改善のサイクル','ゴールと計画がはっきりした関わり方'],empathy:'ゴールが見えた瞬間に、あなたは誰より速く変われる人です。',logic:'実績と結果を明示できる店舗を上位に表示します。'},
      t04:{name:'変化を楽しめる人',state:'新しい自分を試せることを、どこかワクワクできる。それはすごく稀な感覚です。多くの人は変化を怖れる中で、あなたはその感覚を武器に変えられる。背中を押してくれる人と出会えば、一気に変われる。',strength:'変化に抵抗がない。新しい自分を試せるしなやかさがある。',fit:['提案力があり、背中を押してくれる関わり方','安全網を用意した、無理のない挑戦','変化の実感を一緒に確認してくれる人'],empathy:'変われると信じた瞬間に、誰より大きく変われる人です。',logic:'変化の提案力があり、背中を押してくれる店舗を優先します。'},
      t05:{name:'感覚が合えば進める人',state:'理論より雰囲気。スペックより世界観。あなたが「これだ」と感じた瞬間に、誰より深く変わっていく人です。その感覚は正しい。Finemeはあなたの「これだ」を見つけるための場所です。',strength:'自分の感覚を信じられる。一度「これだ」と思ったものへの継続力が高い。',fit:['世界観とスタイルが明確な相手','事例や写真でイメージできる提案','まずは小さく試せる一歩'],empathy:'「これだ」と感じた瞬間に、誰より本気で変われる人です。',logic:'スタイルや思想が明確で、感覚が合う店舗を優先します。'},
      t06:{name:'一緒に作り上げる人',state:'自分だけで決めるのでも、全部任せるのでもなく、対話しながら最善を選びたい。その姿勢は、変化の質を高めます。押し付けではなく、あなたと一緒に考えてくれる人と出会えば、変容は加速します。',strength:'対話を通じて意思決定できる。自分の意見を持ちながら、柔軟に修正できる。',fit:['選択肢を提示し、共同で決める進め方','振り返りと調整を前提にした設計','話しながら方向性をすり合わせられる人'],empathy:'一緒に考えながら進んでいける環境で、あなたは最高のパフォーマンスを発揮します。',logic:'提案と対話のバランスが良く、共同で決めていける店舗を上位に表示します。'}
    };

    /* ===== 物語生成マップ ===== */
    const WHY_STORY={r01:'デートや出会いで、もっと堂々とした自分でいたいと思っているあなたは',r02:'「また同じ結果」を終わらせたいと思い続けてきたあなたは',r03:'誰かより先に、まず自分のことを少し好きになりたいと思っているあなたは',r04:'変わりたい気持ちはある。でも最初の一手がずっと見えなかったあなたは',r05:'何かが変わるタイミングが来ていると感じているあなたは'};
    const TYPE_STORY={w01:'「静かに選ばれる人」になる道を、自分で選んだ',w02:'「力を抜いて好かれる人」になる道を、自分で選んだ',w03:'「余裕が滲み出る人」になる道を、自分で選んだ',w04:'「頼もしさを持つ人」になる道を、自分で選んだ',w05:'「近距離で輝く人」になる道を、自分で選んだ',w06:'「習慣が自信をつくる人」になる道を、自分で選んだ',w07:'「別人になる覚悟がある人」の道を、自分で選んだ',w08:'「節目で脱皮する人」の道を、自分で選んだ'};
    const HOW_STORY={s01:'Finemeは、あなたが納得できる理由を確かめながら進んでいけるよう、最初の地図を渡します。',s02:'Finemeは、あなたがプロに委ねる覚悟を持って最短距離で変われるよう、最初の地図を渡します。',s03:'Finemeは、あなたが誰かと一緒に考えながら自分だけの答えを作れるよう、最初の地図を渡します。'};

    /* ===== 10問フロー用データ ===== */
    const WHY_LABELS={match:'マッチングアプリで、相手に選ばれていない',partner:'好きな人の前で、自信が持てなかった',confidence:'鏡を見るたびに、なんか違う気がする',general:'このままでいていいのか、ふと思った'};
    const DIR_META={A:{label:'清潔感タイプ',emoji:'✨'},B:{label:'知的・洗練タイプ',emoji:'📚'},C:{label:'アクティブ・健康タイプ',emoji:'💪'},D:{label:'おしゃれ・スタイルタイプ',emoji:'🎨'}};
    const HOW_META={sprint:{label:'短期集中型 🚀',cta:'3ヶ月以内に変わるサービスを探す',note:'優先度の高い施策に絞って集中することが、最短で変わるための鍵です。まず最高優先度の1つから、プロと一緒に計画を立てましょう。'},steady:{label:'コツコツ継続型 🌱',cta:'まず1回だけ試せるサービスを探す',note:'無理なく続けるためには「小さく始める」ことが鍵。体験・初回コースから入れるサービスを優先してご案内します。'},guided:{label:'おまかせ型 🤝',cta:'プロに相談・一任できるサービスを探す',note:'プロに導いてもらうことで、迷わず最短ルートを歩めます。カウンセリング込みのサービスや、担当者が継続フォローするサービスを優先します。'},learn:{label:'学習型 📖',cta:'セルフケアも学べるサービスを探す',note:'知識を身につけながら変わることで、サロンに頼り切りにならない「自走力」が生まれます。施術後のホームケア指導があるサービスを優先します。'}};

      /* ②物語カード（v3） */
      try{
        const ws=WHY_STORY[whyId], ts=TYPE_STORY[intentId], hs=HOW_STORY[howStyleId];

          const p=document.createElement('p'); p.textContent=`${ws}、${ts}。${hs}`; card.appendChild(p);
          root.appendChild(card);

      }catch{}

      /* ③プロフィールカード */
      (function(){
        const card=document.createElement('div'); card.className='result-profile-card';
        const title=document.createElement('div'); title.className='result-profile-title'; title.textContent='📍 あなたの診断プロフィール'; card.appendChild(title);
        const rows=document.createElement('div'); rows.className='result-profile-rows';
        const addRow=(key,val)=>{ if(!val) return; const row=document.createElement('div'); row.className='result-profile-row'; const k=document.createElement('span'); k.className='rp-key'; k.textContent=key; const v=document.createElement('span'); v.className='rp-val'; v.textContent=val; row.appendChild(k); row.appendChild(v); rows.appendChild(row); };

      /* ④変容タイプ説明 */

        const p2=document.createElement('p'); p2.style.cssText='font-size:13px;color:#374151;line-height:1.7;margin:0;padding:12px;background:rgba(11,38,64,.04);border-radius:8px;border-left:3px solid #b98f3b'; p2.textContent=howSuffix;

      /* ⑥ギャップ分析（v2のみ） */
      if(gapsAll&&gapsAll.length){

        const narrEl=document.createElement('p'); narrEl.style.cssText='font-size:14px;color:#0f172a;line-height:1.7;margin:0 0 14px'; narrEl.innerHTML=narr; sec.appendChild(narrEl);

      try{ const parts=(copy.strength||'').split(/[、。・\n]/).map(s=>s.trim()).filter(s=>s.length>0&&s.length<=30); const uniq=[]; for(const p of parts){ if(!uniq.includes(p)) uniq.push(p); } uniq.slice(0,3).forEach(h=>{ const span=document.createElement('span'); span.className='chip'; span.textContent=h; chips.appendChild(span); }); }catch{}

      /* ⑧進め方の視点 */
      (function(){
        const tid=step2cls.type_id||'t01';
        function mindsetTips(){ const t=[]; if(Number(axes.motivation)>0) t.push('変わりたい理由が明確。目的と再現性を重視'); if(Number(axes.support)>0) t.push('伴走や確認を重視。納得できる説明が安心'); if(Number(axes.control)>0) t.push('主導権を持って進めたい。透明性と比較を重視'); if(Number(axes.change)>0) t.push('変化の実感を早めたい。小さなビフォー/アフターで検証'); if(!t.length) t.push('今の自分に合う進め方を選ぶことを重視'); return t; }
        function lw(lab){ const s=Number(axes.support)||0,c=Number(axes.change)||0,m=Number(axes.motivation)||0,ctrl=Number(axes.control)||0,L=String(lab); if(/相談|チェック|伴走/.test(L)) return s*2+m; if(/可視化|事前説明|納得|透明/.test(L)) return m*2+ctrl; if(/比較検討/.test(L)) return ctrl*2+m; if(/短期|成果指標|早い|仮説検証/.test(L)) return c*2+m; if(/写真/.test(L)) return c*1.5+m; if(/更新提案|チャレンジ|小さく試/.test(L)) return c*2+s; if(/習慣化|振り返り|継続/.test(L)) return s*2+m; return 0; }
        function choosingTips(){ const map={t01:['事前説明やプロセスの可視化がある','レビューや事例が豊富','比較検討の余地がある'],t02:['相談/チェックの伴走がある','柔軟に調整できる','納得が得られるコミュニケーション'],t03:['短期プランや明確な成果指標','写真で比較できる事例','早い仮説検証を支援'],t04:['更新提案やチャレンジを支援','小さく試して調整できる','変化の実感を可視化'],t05:['ポートフォリオの世界観が一貫','事例写真が豊富','相性の合う雰囲気'],t06:['継続サポートや習慣化の仕組み','定期的な振り返り','無理のない調整']}; return (map[tid]||map.t01).slice().sort((a,b)=>lw(b)-lw(a)); }
        function strategyTips(){ const map={t01:['理解→提案→確認の反復（プロセスを可視化）','目的を明文化し評価指標を決める','小さな変更を写真や比較で検証','意思決定の透明性を確保し、比較検討する'],t02:['定期チェックインを設ける（相談/確認）','不安の共有→合意形成のプロセスを重視','柔軟に調整し、負担を最小化する','習慣化の仕組みで安心して続ける'],t03:['短いスプリントで試す（1〜2週間）','即効性のある小さな変更を試す（写真で比較）','成果指標で評価し、素早く再調整','次の仮説検証へ素早く移る'],t04:['小さく試す→更新提案の反復','段階的に挑戦し、可視化で変化を確認','柔軟に軌道修正できる余地を確保','定期振り返りで次の一歩を決める'],t05:['事前にイメージと世界観を共有','小さな「合致体験」を積み重ねる','写真や事例で方向性をすり合わせ','余白を残して調整できる進め方'],t06:['ルール化して習慣にする（定期実施）','定期振り返りとチェックインで継続','無理のないペース設計で負担を軽減','目的を確認しながら長期で育てる']}; return (map[tid]||map.t01).slice(0,4); }
        const wrap=document.createElement('div'); wrap.className='block';
        const wt=document.createElement('div'); wt.className='block-title'; wt.textContent='進め方の視点'; wrap.appendChild(wt);
        [['考え方の特徴',mindsetTips()],['選び方（お店/人）',choosingTips()],['進め方',strategyTips()]].forEach(([h,arr])=>{ const box=document.createElement('div'); const sh=document.createElement('h4'); sh.textContent=h; box.appendChild(sh); const ul=document.createElement('ul'); arr.slice(0,4).forEach(t=>{ const li=document.createElement('li'); li.textContent=t; ul.appendChild(li); }); box.appendChild(ul); wrap.appendChild(box); });
        const sumAxes=['support','change','control','motivation'].map(k=>Number(axes[k]||0)).reduce((p,c)=>p+c,0);
        const note=document.createElement('p'); note.className='muted'; note.textContent=sumAxes>0?'※ あなたの回答に基づいて並びを調整しています。':'※ あなたの変容タイプに基づいて表示しています。'; wrap.appendChild(note);
        root.appendChild(wrap);
      })();

      /* ⑨どのテンポで変わっていきたいか */
      (function(){
        const wrap=document.createElement('div'); wrap.className='block';
        const wt=document.createElement('div'); wt.className='block-title'; wt.textContent='どのテンポで変わっていきたいか'; wrap.appendChild(wt);
        const tabs=document.createElement('div'); tabs.style.cssText='display:flex;gap:8px;margin:8px 0';
        const btnC=document.createElement('button'); btnC.className='btn btn-ghost'; btnC.style.fontSize='13px'; btnC.textContent='保守';
        const btnS=document.createElement('button'); btnS.className='btn btn-ghost'; btnS.style.fontSize='13px'; btnS.textContent='標準';

        tabs.appendChild(btnC); tabs.appendChild(btnS); tabs.appendChild(btnA); wrap.appendChild(tabs);
        const list=document.createElement('div'); list.className='highlights'; wrap.appendChild(list);

      /* ⑩HOW CTA + 次のステップリンク（v2） */
      if(v2&&dir){
        const howM=HOW_META[v2how];
        if(howM){ const ctaCard=document.createElement('div'); ctaCard.className='how-cta-card'; const cl=document.createElement('div'); cl.className='how-cta-label'; cl.textContent=`あなたのスタイル: ${howM.label}`; const ct=document.createElement('div'); ct.className='how-cta-title'; ct.textContent=howM.cta; const cn=document.createElement('p'); cn.className='how-cta-note'; cn.textContent=howM.note; const ca=document.createElement('a'); ca.className='how-cta-link'; ca.href=`../pages/search.html?direction=${dir}`; ca.textContent=`${howM.cta} →`; ctaCard.appendChild(cl); ctaCard.appendChild(ct); ctaCard.appendChild(cn); ctaCard.appendChild(ca); root.appendChild(ctaCard); }
        if(gapsSorted&&gapsSorted.length>0){ const nlDiv=document.createElement('div'); nlDiv.style.marginBottom='16px'; gapsSorted.slice(0,3).forEach(g=>{ const m=CAT_META[g.cat]; const link=document.createElement('a'); link.className='next-step-link'; link.href=m.url; const ico=document.createElement('span'); ico.className='step-icon'; ico.textContent=m.icon; const txt=document.createElement('span'); txt.className='step-text'; txt.textContent=`${m.label}を探す`; const arr=document.createElement('span'); arr.className='step-arrow'; arr.textContent='→'; link.appendChild(ico); link.appendChild(txt); link.appendChild(arr); nlDiv.appendChild(link); }); root.appendChild(nlDiv); }

      (function(){
        const wrap=document.createElement('div'); wrap.className='block';

        const allCats=['consulting','gym','makeup','hair','diagnosis','fashion','photo','marriage','eyebrow','hairremoval','esthetic','whitening','orthodontics','nail'];
        const iconMap={hair:'💇‍♂️',eyebrow:'✂️',esthetic:'💆‍♂️',fashion:'👔',gym:'🏋️‍♂️',orthodontics:'🦷',makeup:'💄',nail:'💅',photo:'📸',diagnosis:'🔍',consulting:'🧑‍⚕️',marriage:'💍',hairremoval:'🪒',whitening:'✨'};
        const labelMap={consulting:'コンサル/相談',gym:'パーソナルジム',makeup:'メイク',hair:'美容室',diagnosis:'診断',fashion:'ファッション',photo:'写真/撮影',marriage:'婚活/印象',eyebrow:'眉',hairremoval:'脱毛',esthetic:'エステ',whitening:'ホワイトニング',orthodontics:'矯正',nail:'ネイル'};
        const grid=document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px';
        allCats.forEach(c=>{ const a=document.createElement('a'); const u=new URL(BASE+'/pages/search.html',location.origin); u.searchParams.set('category',c); a.href=u.toString(); a.style.cssText='display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;text-decoration:none;font-size:12px;color:#0b2640;font-weight:600;text-align:center;'; const ico=document.createElement('span'); ico.style.fontSize='20px'; ico.textContent=iconMap[c]||'✨'; const lbl=document.createElement('span'); lbl.textContent=labelMap[c]||c; a.appendChild(ico); a.appendChild(lbl); grid.appendChild(a); a.addEventListener('click',()=>{ try{ localStorage.setItem('fineme:goal:category',c); }catch{} }); });

      const searchBtn=document.createElement('a');
      const tq=entry?.name?`?diag=1&keyword=${encodeURIComponent(entry.name)}`:'?diag=1';
      searchBtn.href=`../pages/search.html${tq}`; searchBtn.className='btn'; searchBtn.textContent='最初の一歩を踏み出す';
      const retryA=document.createElement('a'); retryA.href='./index.html'; retryA.className='btn btn-ghost'; retryA.textContent='もう一度診断する';

      const retryBtn=document.createElement('button'); retryBtn.className='retry-btn'; retryBtn.textContent='← もう一度診断する'; retryBtn.addEventListener('click',()=>{ window.location.href='./index.html'; }); root.appendChild(retryBtn);
    }

    const toast=document.createElement('div'); toast.className='toast'; document.body.appendChild(toast);
  })();
